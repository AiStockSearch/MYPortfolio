  ru:
    title: "60 FPS на торговых графиках в React Native"
    subtitle: "Оптимизация рендеринга для real-time финтех приложений"
    readTime: "6 мин"
    excerpt: "HAQQEX — это ордербук, свечные графики и тысячи транзакций в реальном времени. Рассказываю, как добился стабильных 60 FPS и почему стандартные подходы не работают."
    body: |
      ## Контекст

      Трейдинг — это самый жёсткий кейс для мобильного UI: данные меняются каждые 100ms, списки длинные, анимации должны быть плавными.

      ## Главные враги производительности

      **1. JS thread — узкое место**

      ```typescript
      // ❌ Плохо: каждый тик через JS bridge
      socket.on('price', (data) => setState({ price: data }));

      // ✅ Хорошо: батчинг + Reanimated на UI thread
      socket.on('price', batchUpdates(() => priceSharedValue.value = data.price));
      ```

      **2. FlatList без оптимизации убивает память**

      Ключевые пропсы: `removeClippedSubviews`, `maxToRenderPerBatch={10}`, `windowSize={5}`.

      ## Итог

      Стабильные 60 FPS на iPhone 12 и флагманских Android устройствах.
  en:
    title: "60 FPS trading charts in React Native"
    subtitle: "Rendering tricks for real-time fintech UIs"
    readTime: "6 min"
    excerpt: "HAQQEX pairs order books, candle charts, and live transactions. Here’s how we kept 60 FPS when naive React patterns fall apart."
    body: |
      ## Context

      Trading UIs are brutal: ticks every ~100ms, long lists, and animations that must stay smooth.

      ## Biggest performance traps

      **1. The JS thread becomes the bottleneck**

      ```typescript
      // ❌ Bad: every tick crosses the bridge
      socket.on('price', (data) => setState({ price: data }));

      // ✅ Better: batch + Reanimated on the UI thread
      socket.on('price', batchUpdates(() => (priceSharedValue.value = data.price)));
      ```

      **2. Un-tuned FlatList eats memory**

      Tune `removeClippedSubviews`, `maxToRenderPerBatch={10}`, `windowSize={5}`.

      ## Result

      Stable 60 FPS on iPhone 12-class devices and flagship Android hardware.
