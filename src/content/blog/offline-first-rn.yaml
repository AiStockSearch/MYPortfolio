    subtitle: "Как мы построили ERP, который работает без интернета"
    readTime: "8 мин"
    excerpt: "Склад без Wi-Fi — это реальность. Рассказываю, как проектировал offline-first систему для Flowwow: локальная база, delta-sync протокол и разрешение конфликтов."
    body: |
      ## Проблема

      Когда ко мне пришёл проект Flowwow, казалось бы простая задача — мобильный ERP для склада. Но первый же разговор с операторами всё изменил: *«У нас на складе нет интернета»*.

      ## Архитектура

      Я выбрал связку **SQLite (через WatermelonDB) + custom Sync Engine**. Ключевые решения:

      ```typescript
      // Delta sync: отправляем только изменённые записи
      const syncDelta = async (lastSyncTs: number) => {
        const changes = await db.changes.where('updated_at').gt(lastSyncTs).fetch();
        return pushToServer(changes);
      };
      ```

      ### Три принципа offline-first:
      1. **Local first** — все операции сначала пишутся локально
      2. **Optimistic UI** — UI не ждёт сервер
      3. **Conflict resolution** — last-write-wins с ручным разрешением критичных конфликтов

      ## Результат

      Время синхронизации сократилось на **40%** для магазинов с 50 000+ SKU. Операторы перестали замечать сеть.
  en:
    title: "Offline-first architecture in React Native"
    subtitle: "How we shipped an ERP that works without the internet"
    readTime: "8 min"
    excerpt: "No Wi‑Fi in the warehouse is normal. Here’s how we designed Flowwow’s offline stack: local DB, delta sync, and conflict handling."
    body: |
      ## The problem

      Flowwow looked like “just” a mobile ERP — until operators said: *“We don’t have internet on the floor.”*

      ## Architecture

      We paired **SQLite (via WatermelonDB) with a custom sync engine**:

      ```typescript
      // Delta sync: only push what changed
      const syncDelta = async (lastSyncTs: number) => {
        const changes = await db.changes.where('updated_at').gt(lastSyncTs).fetch();
        return pushToServer(changes);
      };
      ```

      ### Three offline-first rules
      1. **Local first** — writes land locally immediately
      2. **Optimistic UI** — never block the UI on the network
      3. **Conflict resolution** — LWW plus manual paths for critical rows

      ## Outcome

      Sync time dropped **~40%** for 50k+ SKU stores — operators stopped “feeling” the network.
