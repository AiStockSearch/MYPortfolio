    title: "Cardano vs Ethereum for mobile DApps: hands-on notes"
    subtitle: "Two projects, two chains — what I’d pick in 2025?"
    readTime: "9 min"
    excerpt: "I shipped DApps on Ethereum (HAWEX) and Cardano (CosmoFusion DAO). A frank comparison from a mobile engineer’s perspective — no marketing fluff."
    body: |
      ## Context

      I built wallet flows and transaction signing on **Ethereum** (EVM, ethers.js) and on **Cardano** (UTxO, CIP-30 dApp connectors). The chains feel similar in slides; on mobile they are not.

      ## Developer experience

      On Ethereum, tooling is mature: testnets, local nodes, ABI encoding, and a huge stack overflow of examples. Cardano’s mobile story is thinner — you rely more on specific wallets, CIPs, and sometimes lagging RN libraries.

      ## UX and fees

      Users care about **time-to-confirm** and **predictable cost**. Ethereum L1 can be expensive; L2 helps. Cardano fees are usually low, but wallet UX and “which UTxOs are selected” can confuse first-time users unless you explain it in the UI.

      ## What I’d choose today

      - **Ethereum / EVM** if you need the widest wallet support, DeFi legos, and hiring pool.
      - **Cardano** if the product roadmap fits UTxO constraints and you can invest in wallet-specific QA.

      Neither is “better” in the abstract — **match the chain to the product and the team you can actually ship with**. See also [web3 + React Native](/blog/web3-react-native) for wallet integration patterns.
  ru:
    title: "Cardano vs Ethereum для мобильных DApp: личный опыт"
    subtitle: "Два проекта, два блокчейна — что выбрать в 2025?"
    readTime: "9 мин"
    excerpt: "Я строил DApp на Ethereum (HAWEX) и на Cardano (CosmoFusion DAO). Вот честное сравнение с точки зрения разработчика мобильных приложений — без маркетинга."
    body: |
      ## Контекст

      Делал кошельки и подпись транзакций на **Ethereum** (EVM, ethers.js) и на **Cardano** (UTxO, dApp-коннекторы по CIP-30). В презентациях цепочки похожи; в приложении — нет.

      ## Разработка

      У Ethereum экосистема толще: тестнеты, ABI, примеров больше. У Cardano в мобилке чаще приходится упираться в конкретные кошельки, CIP и качество RN-обвязок.

      ## UX и комиссии

      Пользователю важны **скорость подтверждения** и **понятная цена**. L1 Ethereum может быть дорогим; L2 снимает часть боли. В Cardano комиссии обычно низкие, но без объяснений в UI про UTxO новички теряются.

      ## Что бы выбрал сейчас

      - **Ethereum / EVM** — если нужны охват кошельков, DeFi и проще нанять команду.
      - **Cardano** — если продукт ложится в UTxO-модель и вы готовы вкладываться в QA под кошельки.

      Универсального «лучше» нет: **цепочка под продукт и команду, с которой реально уедете в прод**. Про интеграцию кошельков в RN — в статье [Web3 + React Native](/blog/web3-react-native).
