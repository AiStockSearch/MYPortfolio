    title: "Web3 + React Native: интеграция блокчейн-кошельков"
    subtitle: "Практическое руководство от HD-кошелька до подписи транзакций"
    readTime: "10 мин"
    excerpt: "Делаю крипто-кошелёк в первый раз? Вот всё, что я узнал за 3 проекта: генерация ключей, хранение в Secure Enclave, подпись транзакций и самые опасные ошибки."
    body: |
      ## С чего начать

      Главное правило: **никогда не храни приватные ключи в AsyncStorage**. Только Keychain (iOS) / Keystore (Android).

      ## HD Wallet генерация

      ```typescript
      import { ethers } from 'ethers';

      const generateWallet = () => {
        const wallet = ethers.Wallet.createRandom();
        return {
          address: wallet.address,
          mnemonic: wallet.mnemonic.phrase, // показать пользователю один раз
          privateKey: wallet.privateKey,    // сохранить в Keychain
        };
      };
      ```

      ## Secure storage

      Используй `react-native-keychain` — он автоматически выбирает Secure Enclave на iOS и StrongBox на Android.
  en:
    title: "Web3 + React Native: shipping blockchain wallets"
    subtitle: "From HD wallets to transaction signing — a practical guide"
    readTime: "10 min"
    excerpt: "Building a crypto wallet for the first time? Here’s what three production apps taught me about keys, secure storage, signing, and the mistakes that hurt the most."
    body: |
      ## Start here

      **Never store private keys in AsyncStorage.** Use Keychain (iOS) / Keystore (Android).

      ## HD wallet generation

      ```typescript
      import { ethers } from 'ethers';

      const generateWallet = () => {
        const wallet = ethers.Wallet.createRandom();
        return {
          address: wallet.address,
          mnemonic: wallet.mnemonic.phrase, // show once
          privateKey: wallet.privateKey,    // store in Keychain
        };
      };
      ```

      ## Secure storage

      Use `react-native-keychain` — it maps to Secure Enclave on iOS and StrongBox on Android when available.
