    stack: []
    blocks:
      - type: prose
        text: |
          ## Контент из YAML

          Добавьте новый файл `*.yaml` в `src/content/sitePages/` — Vite подхватит его через `import.meta.glob`, править список страниц вручную не нужно.

          Типы **блоков** те же, что в `project.yaml` проектов: `prose`, `section`, `heroImage`, `image`, `keyResults`, `techStack`, `partner`, `appLinks` и т.д.

          У `heroImage` без поля `src` путь к картинке по умолчанию — `/projects/<slug>.png`; укажите `src`, если файл в другом месте.
      - type: section
        title: "Маршрут"
      - type: prose
        text: "Страница открывается по адресу **`/page/how-we-work`** (slug из YAML)."
