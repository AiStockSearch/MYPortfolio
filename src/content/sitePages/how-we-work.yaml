    blocks:
      - type: prose
        text: |
          ## Content-driven pages

          Add a new `*.yaml` file under `src/content/sitePages/`. The app picks it up via `import.meta.glob` — no registry file to edit.

          Use the same **block** `type` values as in project `project.yaml`: `prose`, `section`, `heroImage`, `image`, `keyResults`, `techStack`, `partner`, `appLinks`, etc.

          For `heroImage` without `src`, the image path defaults to `/projects/<slug>.png` — set `src` explicitly if your asset lives elsewhere.
      - type: section
        title: "Routing"
      - type: prose
        text: "These pages are served at **`/page/how-we-work`** (slug from YAML)."
  ru:
    typeLabel: "Процесс"
    title: "Как мы работаем"
