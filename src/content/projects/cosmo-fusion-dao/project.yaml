      - type: prose
        text: |
          [CosmoFusion DAO](https://cosmofusiondao.onrender.com/) — платформа и сообщество для **коллективного интеллекта** и открытых инноваций. На живом сайте метафора «тысячи астронавтов смотрят на одну галактику»: в одиночку видим лишь срез реальности, вместе — картину, к которой можно приближаться через обсуждение и проверку.

          Идеи идут путь от **гипотезы** к результату через открытый диалог и прозрачные решения: **блокчейн** фиксирует голоса и аргументацию, **ИИ** помогает увидеть закономерности в больших массивах предложений и дискуссий.
      - type: section
        title: Почему одного «астронавта» мало
      - type: prose
        text: |
          Централизованные команды и закрытые комитеты упираются в те же ограничения, что описаны на сайте:

          - **Централизация** — узкий круг задаёт курс; остальные видят итог, но не логику.
          - **Непрозрачность** — «чёрный ящик»: неясно, какие данные и альтернативы учитывались.
          - **Память организации** — каждый цикл начинается заново; уроки и несогласие редко становятся устойчивым наследием.

          CosmoFusion DAO задаёт управление как **публичный процесс**: предложения, споры, голоса и разборы могут жить on-chain и в открытом журнале — сообщество учится вслух.
      - type: section
        title: От разных точек зрения к замкнутому циклу
      - type: prose
        text: |
          На публичной дорожной карте задан цикл:

          1. Сбор вкладов участников  
          2. **ИИ** — кластеризация сигналов и паттернов (не замена людей, а масштаб внимания)  
          3. **Обсуждение** в прозрачной среде  
          4. **Голосование** с ончейн-фиксацией  
          5. **Внедрение** и мониторинг  
          6. **Возврат результатов** в общую базу знаний  

          Это перекликается с идеей, что несогласие полезно для поиска истины (в духе аргументов Милля) — в форме DAO это становится **процедурой**, а не только философией. Развёрнутые тексты — на [Substack](https://cosmofusiondao.substack.com/) и в каналах, на которые ведёт основной сайт.
      - type: section
        title: Инженерный слой (грант)
      - type: prose
        text: |
          С точки зрения реализации проект вырос из **грантовой** линии: **React 18**, **Apollo Client**, эксперименты с управлением в экосистеме **Cardano** и **ИИ-слой** (модели класса GPT-4 / Claude) для сводок тредов и поддержки ревью предложений. Публичный GitHub организации — [CosmoFusionDAO](https://github.com/CosmoFusionDAO); код приложения грантовой ветки остаётся доступен по ссылке **Репо гранта** выше.
