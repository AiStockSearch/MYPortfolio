      - "type": "heroImage"
        "src": "/projects/green-api-chat/instances-dashboard.webp"
        "alt": "GREEN-API Chat — Instances screen with statuses"
      - "type": "section"
        "sectionKey": "overview"
      - "type": "prose"
        "text": |
          **GREEN-API Chat** is a messenger web client built with **React + TypeScript (Vite)** on top of GREEN-API: **WhatsApp**, **Telegram** and **MAX**. Test assignment for GREEN-API; October 2026.

          - Multiple instances at once: an “Instances” screen with authorization statuses.
          - Unified chat list with a per-instance filter and parallel polling of notification queues.
          - Sign-in with instance keys plus a partner mode: create an instance, authorize via QR or code.
          - Verified live on WhatsApp — sending and receiving messages.
      - "type": "image"
        "src": "/projects/green-api-chat/active-chat.webp"
        "alt": "An open chat in GREEN-API Chat (demo data)"
        "caption": "Active chat (demo mode)"
      - "type": "image"
        "src": "/projects/green-api-chat/chat-filter.webp"
        "alt": "Chat list filtered by instance"
        "caption": "Unified chat list with a per-instance filter"
      - "type": "section"
        "sectionKey": "technical"
      - "type": "prose"
        "text": |
          - **PWA** that never caches tokens or API responses.
          - **Docker + nginx** with a CORS proxy.
          - **CI/CD on GitHub Actions**: lint, Vitest, Cypress, image publishing to GHCR and deployment to GitHub Pages.
          - **145 tests**.
