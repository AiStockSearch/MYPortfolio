        "text": |
          **GREEN-API Chat** — веб-клиент мессенджеров на **React + TypeScript (Vite)** через GREEN-API: **WhatsApp**, **Telegram** и **MAX**. Тестовое задание для GREEN-API; период — октябрь 2026.

          - Несколько инстансов одновременно: экран «Инстансы» со статусами авторизации.
          - Общий список чатов с фильтром по инстансу и параллельным опросом очередей уведомлений.
          - Вход по ключам инстанса и режим партнёра: создание инстанса, авторизация по QR или коду.
          - Проверено вживую на WhatsApp — отправка и приём сообщений.
