  "stubOverviewProse":
    "en": "**Production-ready** consumer app: **React Navigation** (stacks & tabs), **RTK Query** on **RESTful**
      catalog / cart / checkout / profile APIs with cache and invalidation; **WebSocket** for live price, stock and ops
      signals next to REST snapshots. **react-native-mmkv** for fast KV — tokens, feature flags, lightweight prefs
      alongside the RTK cache strategy. **Pushy** for push delivery; **Amplitude**, **Firebase Analytics**,
      **Crashlytics** and **Sentry** for funnels and stability.

      **UI:** dense **SectionList** layouts (grouped catalog, promos, row recycling), **React Native Animated** for
      controlled motion, **light/dark themes** across navigation and lists. **Auth**, **registration**, **biometrics** with
      credential fallback; read-heavy **profile** and **order history**.

      **Shopping path:** assemble the **cart** from the Dom Edy assortment, place **orders**, complete **payment** and
      **purchase** confirmation — error states tuned for flaky networks. **GitLab** MRs, reviews and CI with the partner team."
    "ru": "**Production-ready** приложение: **React Navigation** (стеки и табы), **RTK Query** поверх **REST**
      (каталог, корзина, чекаут, профиль) с кэшем и инвалидацией; **WebSocket** для живых цен, остатков и операционных
      событий параллельно REST. **react-native-mmkv** для быстрых KV — токены, флаги, лёгкие настройки рядом с политикой
      кэша RTK. **Pushy** для push; **Amplitude**, **Firebase Analytics**, **Crashlytics**, **Sentry** для воронок и стабильности.

      **UI:** плотные **SectionList** (сгруппированный каталог, промо, переиспользование строк), **React Native Animated**,
      **светлая и тёмная тема** в навигации и списках. **Авторизация**, **регистрация**, **биометрия** с fallback на форму;
      много экранов **профиля** и **истории заказов** в режиме чтения.

      **Путь покупки:** **корзина** из ассортимента Дом Еды, **заказ**, **оплата**, **подтверждение покупки** — UX при
      слабой сети. **GitLab**: MR, ревью, CI с командой партнёра."
