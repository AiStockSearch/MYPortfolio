"achByArea":
  "en":
    "front":
      - "<span class='m'>Pixel-perfect</span> **Dom Edy** screens: dense **catalog**, **SectionList** sections (headers, row
        recycling), promotional strips / cards"
      - "<span class='m'>Complex UI</span>: layered layouts, badges, controlled **Animated** timings for micro-motions —
        clarity on budget Android in Kostroma rollout"
      - "**Theming**: light/dark **theme** tokens wired through navigation + lists so commerce surfaces stay consistent"
    "mobile":
      - "**Production React Native** app: **Mobility Топ** contract on **Dom Edy** consumer client; store-track mindset"
      - "**Navigation**: **React Navigation** stacks & tabs; guarded flows for **auth**, **registration**, profile & **order
        history** (read-heavy)"
      - "**State & API**: **RTK Query** over **RESTful** services (catalog, cart, checkout, profile); cache policies, invalidation,
        optimistic-friendly patterns where safe"
      - "**Realtime**: **WebSocket** channel for price/stock/ops signals the UI subscribed to alongside REST snapshots"
      - "**Persistence**: **react-native-mmkv** for fast key-value (tokens, flags, lightweight prefs) next to RTK cache strategy"
      - "**Push**: **Pushy** for reliable notification delivery in the project’s transport choice"
      - "**Analytics**: **Amplitude** + complementary funnel/crash tooling (**Firebase Analytics**, **Crashlytics**,
        **Sentry**) in a production observability bundle"
      - "**Biometrics**: quick return-to-session after idle; falls back to credential form per policy"
      - "**Shopping journey**: **cart** assembly from Dom Edy assortment, **order placement**, **payment**, **purchase**
        confirmation — error UX tuned for flaky networks"
      - "**GitLab**: MR workflow, reviews, CI hooks aligned with partner team"
    "backend":
      - "**REST**: RESTful contracts catalog/basket/order/payment; idiomatic errors mapped for RTK Query layers"
      - "**WebSocket**: server push / streaming endpoints consumed with reconnect hygiene"
  "ru":
    "front":
      - "<span class='m'>Pixel-perfect</span> экраны **«Дом Еды»**: плотный **каталог**, **SectionList** с секциями и
        переиспользованием строк, промо-блоки и карточки"
      - "<span class='m'>Сложный UI</span>: многослойная вёрстка, бейджи, отточенные **Animated**-анимации без «лишнего шума»"
      - "**Темы**: светлая и тёмная **тема**, общие токены в навигации и списках"
    "mobile":
      - "**React Native** уровня продакшена; контракт **Mobility Топ**, клиент **«Дом Еды»**, ориентир на **Кострому**"
      - "**Навигация**: **React Navigation** (стеки, табы); сценарии **авторизации**, **регистрации**, профиль и **история
        заказов** (много read-only просмотров)"
      - "**Данные**: **RTK Query** поверх **REST** (каталог, корзина, чекаут, профиль); кэш, инвалидация, аккуратные
        оптимистичные обновления где уместно"
      - "**WebSocket** для живых сигналов (остатки, цены, операционные события) параллельно REST"
      - "**react-native-mmkv**: быстрые KV (токены, флаги, настройки) рядом с политикой кэша RTK"
      - "**Pushy** как транспорт **push**-уведомлений в этом проекте"
      - "**Аналитика**: **Amplitude** + **Firebase Analytics**, **Crashlytics**, **Sentry** — полный контур наблюдаемости"
      - "**Биометрия** для быстрого возврата в сессию с fallback на форму входа"
      - "**Путь покупки**: сбор **корзины** из ассортимента Дом Еды, **заказ**, **оплата**, **подтверждение покупки**;
        UX на плохой сети"
      - "**GitLab**: MR, ревью, CI совместно с командой заказчика"
    "backend":
      - "**RESTful API**: каталог, корзина, заказ, оплата — ошибки и коды согласованы со слоем RTK Query"
