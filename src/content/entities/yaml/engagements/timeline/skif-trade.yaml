          "text": "### Идея и контекст\n\n**Скиф Трейд** (Казахстан, [smallmart.kz](https://smallmart.kz/)) — продуктовая
            розничная сеть. Мобильный продукт на **Expo / React Native**: **кассовый модуль (POS)** и **корпоративный
            мессенджер** для оперативного общения персонала внутри компании. Изоморфный слой бизнес-логики шарился с web-клиентом.\n\n**Роль:**
            **Senior Mobile Developer / Tech Lead**. **Формат:** проектная работа / **part-time**, не exclusive full-time
            (авг — дек 2025, 5 месяцев).\n\n**Параллельные контракты:**\n- **авг — сен 2025** — пересечение с **Мираполис**
            (ГПХ / совмещение) и **haqqex** (outstaff);\n- **окт — дек 2025** — параллельно только с **haqqex** (outstaff).\n\n**Уникальный
            стек:** Expo; NativeWind / Tailwind; **Feature-Sliced Design (FSD)**; POS / фискализация (Z/X-отчёты); корпоративный
            мессенджер (каналы, треды).\n\n### Корпоративный мессенджер & управление персоналом\n\nСоздал **с нуля** модуль
            Slack-подобного внутреннего чата и системы управления сотрудниками для оперативного общения внутри компании:
            **публичные/приватные каналы**, **треды сообщений**, **статусы присутствия**, **обмен файлами/медиа** и **быстрый
            поиск** по истории диалогов для оперативного решения рабочих вопросов персонала.\n\n### Кассовый модуль & торговые
            операции (POS Engine)\n\nРазработал и спроектировал функционал для **приёма и обработки платежей** через кассовый
            аппарат, логику **открытия/закрытия рабочих смен**, снятия фискальных **Z-отчётов** и **X-отчётов**, а также процессы
            **проведения инвентаризации** и оперативного **учёта товарных остатков** на складах и в торговом зале.\n\n### Монорепозиторий
            & изоморфные библиотеки\n\nВнедрил **Yarn / pnpm Workspaces** для изоморфной монорепозиторной структуры: изолировал общий
            бизнес-функционал (**кассовая математика**, утилиты валидации, **DTO**) в независимые внутренние библиотеки,
            **переиспользуемые между мобильным и фронтенд-клиентами**.\n\n### Архитектура и Real-Time\n\nПостроил реактивную UI-архитектуру
            на базе **Expo**, **NativeWind** (Tailwind CSS), styled-components и StyleSheet по методологии **FSD** и **Atomic Design**.
            Внедрил **WebSockets / Socket.io** с поддержкой **optimistic updates** интерфейса через **TanStack Query** — мгновенная
            доставка сообщений и кассовых статусов даже при **слабом интернет-соединении**.\n\n### Компоненты и изолированное тестирование\n\n**React
            Cosmos** для UI — **Time-to-Market −30%**, единообразие интерфейса между POS и мессенджером.\n\n### Оптимизация производительности
            списков\n\nКастомная **виртуализация** номенклатуры, сообщений и медиа — **стабильные 60 FPS** при быстром скролле (без фризов
            на тяжёлых каналах и каталогах).\n\n### Техническое лидерство\n\n**Tech Lead:** техническое руководство мобильным направлением,
            Code Review, проектирование API-контрактов и процесс релизов.\n"
