          "text": "### Idea & context\n\n**Skif Trade** (Kazakhstan, [smallmart.kz](https://smallmart.kz/)) — grocery retail chain.
            Mobile product on **Expo / React Native**: **POS cashier module** and **corporate messenger** for operational staff communication.
            Isomorphic business layer shared with the web client.\n\n**Role:** **Senior Mobile Developer / Tech Lead**. **Engagement:** project
            work / **part-time**, not exclusive full-time (Aug — Dec 2025, 5 months).\n\n**Parallel contracts:**\n- **Aug — Sep 2025** — overlap with
            **Mirapolis** (GPH / part-time) and **haqqex** (outstaff);\n- **Oct — Dec 2025** — parallel with **haqqex** only.\n\n**Unique stack:**
            Expo; NativeWind / Tailwind; **Feature-Sliced Design (FSD)**; POS / fiscalization (Z/X reports); corporate messenger (channels, threads).\n\n###
            Corporate messenger & staff ops\n\nBuilt **from scratch** a Slack-like internal chat and employee management module: **public/private channels**,
            **message threads**, **presence statuses**, **file/media sharing** and **fast history search** for operational staff questions.\n\n### POS engine
            & trade operations\n\nDesigned and built payment processing via cash register, **shift open/close**, fiscal **Z-reports** and **X-reports**,
            **inventory** and **floor stock accounting** in store and warehouse.\n\n### Monorepo & isomorphic libraries\n\n**Yarn / pnpm Workspaces** monorepo
            isolating shared business logic (**cash math**, validation utilities, **DTOs**) in independent internal libraries **reusable between mobile and web
            frontend clients**.\n\n### Architecture & real-time\n\nReactive UI on **Expo**, **NativeWind** (Tailwind CSS), styled-components and StyleSheet per
            **FSD** and **Atomic Design**. **WebSockets / Socket.io** with **optimistic updates** via **TanStack Query** — instant message delivery and cash
            statuses even on **weak connectivity**.\n\n### Components & isolated UI development\n\n**React Cosmos** for UI — **Time-to-Market −30%**, consistent
            interface across POS and messenger modules.\n\n### List performance optimization\n\nCustom **virtualization** for product nomenclature, messages and
            media — stable **60 FPS** scroll on heavy channels and catalogs (no freezes).\n\n### Technical leadership\n\n**Tech Lead:** mobile track leadership,
            Code Review, API contract design and release process.\n"
