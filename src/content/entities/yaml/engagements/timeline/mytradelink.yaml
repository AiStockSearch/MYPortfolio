        - "type": "prose"
          "text": "**MyTradeLink** — парт-тайм / **фри-тайм** история: небольшой **фонд**, ориентированный на доход от **реферальных комиссий** с
            криптовалютных **бирж**. Параллельно команда развивала продуктовую механику **торговых конкурсов** — соревнования по **оборотам** и
            активности пользователей, **турниры**, создание и ведение кампаний, учёт **участников** и **победителей**. Моя зона — **полный контур
            администрирования**: развёрнутый **Apollo Server** (GraphQL) на **Node.js** и **Express** для выдачи данных в админку, работа с **MongoDB**
            и **PostgreSQL**, **кеширование** и **агрегация** метрик, чтобы на фронте отрисовывать понятную картину без «прострела» сырыми запросами.
            **Админ-панель** на **React** и **MUI** — запросы к GraphQL, визуализация статистики: сколько **конкурсов** проведено, разрезы **по дню, месяцу,
            году**, доля **прибыли / комиссий**, разбор **выигравших**. В интеграционном периметре — крупные **CEX**: **Bybit**, **Binance**, **FTX**
            (исторический контекст), **OKX**, **Bitget**.\n"
        - "type": "keyResults"
          "items":
            - "val": "Apollo"
              "lbl": "Admin API"
            - "val": "2×DB"
              "lbl": "Mongo+PG"
            - "val": "5+"
              "lbl": "Биржи"
        - "type": "prose"
          "text": "### Идея и контекст\n\nЗадача фонда — стабильный **реферальный** поток с бирж, а продуктовый слой конкурсов увеличивал вовлечённость
            и соревновательный формат вокруг **            торговых оборотов**. Админу нужен был **единый** интерфейс: завести турнир, отследить **жизненный цикл**
            конкурса, увидеть **участников** и **победителей**, сверить **периоды** (день / месяц / год) и **финансовый** срез (**процент прибыли** /
            комиссионная доля в логике фонда). **GraphQL** здесь логично ложился на сценарий «много срезов одной сущности» без размножения REST-эндпоинтов.\n"
        - "type": "prose"
          "text": "### Итог за ~3 месяца\n\n- **Бэкенд:** **Apollo Server** + **Express**, схема под админские запросы, слой агрегации и кеша.\n- **Данные:** **MongoDB** и **PostgreSQL** — разделение операционного и аналитического контура в рамках задачи.\n- **Фронт:** **React** + **MUI** — панель оператора с опорой на GraphQL.\n- **Домен:** конкурсы по **оборотам**, турниры, учёт победителей; привязка к биржам **Bybit**, **Binance**, **FTX**, **OKX**, **Bitget**.\n- **Формат:** **part-time**, без мобильного контура — только **фронт** и **бэкенд**.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Техническая реализация\n\n**API:** **Apollo Server** на **Node.js** + **Express** — резолверы под сводные запросы админки (конкурсы,
            турниры, участники, временные окна, финансовые агрегаты). **Хранилища:** **MongoDB** и **PostgreSQL** — по назначению в проекте (операции vs
            отчётность / нормализованные сущности). **Клиент:** **Apollo Client** + **React** + **MUI**. **Прод:** развёрнутый GraphQL-сервер как единая
            точка входа для админских данных. Сайт/витрина: [mytrades.link](https://mytrades.link).\n"
        - "type": "techStack"
          "tags":
