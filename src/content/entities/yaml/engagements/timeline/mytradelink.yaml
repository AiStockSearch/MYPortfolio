      "blocks":
        - "type": "heroImage"
          "alt": "MyTradeLink"
        - "type": "section"
          "sectionKey": "overview"
        - "type": "prose"
          "text": "A **part-time / side-project** engagement with a small **fund** monetized through **exchange referral commissions**, plus a
            **trading-contest** layer: volume-based **crypto competitions**, **tournaments**, campaign creation, participant counts and **winner**
            tracking. I built the **operator admin** end-to-end: **Apollo Server** (GraphQL) on **Node.js** + **Express**, **MongoDB** + **PostgreSQL**,
            caching/aggregation so the UI gets **consolidated** responses, and a **React** + **MUI** front-end for query-driven dashboards — contests run,
            **day / month / year** cuts, **profit / fee-share** views, leaderboard-style outcomes. Exchange touchpoints included **Bybit**, **Binance**,
            **FTX** (historical), **OKX**, and **Bitget**. No mobile scope — **web admin + API only**.\n"
        - "type": "keyResults"
          "items":
            - "val": "Apollo"
              "lbl": "Admin API"
            - "val": "2×DB"
              "lbl": "Mongo+PG"
            - "val": "5+"
              "lbl": "Exchanges"
        - "type": "prose"
          "text": "### Idea & context\n\nThe fund needed referral economics to work hand-in-hand with **engagement mechanics**: contests centred on
            **trading turnover**, tournaments, and clear **operator** tooling. Admins had to create and monitor competitions, see **how many** ran in a
            given **day / month / year**, who **won**, and how **profit / commission share** looked for the period. **GraphQL** fit the “many slices of
            the same domain” problem better than a growing REST surface.\n"
        - "type": "prose"
          "text": "### Outcomes (~3 months)\n\n- **Backend:** **Apollo Server** + **Express**, schema tuned for admin reads/writes, aggregation/caching layer.\n- **Data:** **MongoDB** + **PostgreSQL** for operational vs reporting needs.\n- **Frontend:** **React** + **MUI** admin, **Apollo Client**.\n- **Domain:** turnover contests, tournaments, winners; integrations with **Bybit**, **Binance**, **FTX**, **OKX**, **Bitget**.\n- **Shape:** **part-time**, **full-stack** web only.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Engineering notes\n\n**API:** **Apollo Server** on **Node.js** + **Express** — resolvers for consolidated admin queries (contests,
            tournaments, participants, time windows, financial aggregates). **Storage:** **MongoDB** and **PostgreSQL** used for their respective roles in the
            project. **Client:** **Apollo Client** with **React** + **MUI**. **Deployment:** hosted GraphQL endpoint backing the admin UI. Landing:
            [mytrades.link](https://mytrades.link).\n"
        - "type": "techStack"
