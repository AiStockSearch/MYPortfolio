"shortDesc":
  "en": "Solo **React Native** bike-sharing client in **Crimea** (GPC + sole proprietor): push, **BLE** locks,
    **GPS** + maps, in-app **payments**; tours & schedules. **RN ~0.69 / 0.74**, **two** store releases."
  "ru": "Соло **React Native**: велошеринг в **Крыму** (ГПХ/ИП) — push, **Bluetooth**-замки, **GPS** и карты,
    **оплаты**; туры и расписание. Ветки **RN ~0.69 / 0.74**, **два** релиза в сторы."
"cvShortDesc":
  "en": "Crimea bike-sharing RN (GPC/IP): push, BLE locks, GPS, payments, Maps; RN 0.69/0.74, 2 store releases."
  "ru": "Велошеринг Крым, RN (ГПХ/ИП): push, Bluetooth-замки, GPS, оплаты, карты; RN 0.69/0.74, 2 релиза."
"achByArea":
  "en":
    "front":
      - "Flows for <span class='m'>unlocking / locking</span> shared bikes and confirming session state in the
        UI"
      - "Screens for <span class='m'>tours</span> and <span class='m'>schedule</span> so routes and time slots
        were understandable on a phone"
    "mobile":
      - "<span class='m'>Full ownership</span> of the React Native app on <span class='m'>RN 0.69 / 0.74</span>
        tracks (CLI-era upgrades); <span class='m'>two production releases</span> for iOS and Android"
      - "<span class='m'>Push</span>: delivery and handling of booking / fleet / payment-related notifications"
      - "<span class='m'>Bluetooth</span> for smart-lock open/close, pairing states, and resilient UX on flaky
        radio"
      - "<span class='m'>GPS & geolocation</span> with Maps — stations, routes, tour context, permission flows"
      - "<span class='m'>Payments</span>: mobile checkout hooks to the operator’s acquiring / wallet model"
      - "<span class='m'>Google Maps</span> for Crimea coverage; tour builder and schedule tied to backend"
    "backend":
      - "REST/GraphQL consumption for locks, tours, timetables, push tokens, and payment status from the
        operator’s services"
  "ru":
    "front":
      - "Сценарии <span class='m'>открытия и закрытия</span> замков общего велотранспорта и отображение
        состояния аренды"
      - "Экраны <span class='m'>туров</span> и <span class='m'>расписания</span> — маршруты и слоты на телефоне"
    "mobile":
      - "<span class='m'>Полная ответственность</span> за приложение на <span class='m'>React Native 0.69 /
        0.74</span> (апгрейды CLI); <span class='m'>два production-релиза</span> под iOS и Android"
      - "<span class='m'>Push</span>: доставка и обработка уведомлений (аренда, парк, оплаты)"
      - "<span class='m'>Bluetooth</span> для умных замков: открытие/закрытие, сопряжение, устойчивость при слабом
        сигнале"
      - "<span class='m'>GPS и геолокация</span> вместе с картами — станции, маршруты, туры, разрешения ОС"
      - "<span class='m'>Платежи</span>: интеграция мобильной оплаты с моделью оператора (эквайринг / кошелёк)"
      - "<span class='m'>Google Maps</span>, туры и <span class='m'>расписание</span> по данным бэкенда"
    "backend":
      - "REST/GraphQL — замки, туры, расписание, токены push, статусы оплат"
