        - "type": "prose"
          "text": "**[ZenCar](https://zencar.tech/en)** is an automotive / service **product ecosystem** anchored in the **Innopolis** SEZ (see
            [about the company](https://zencar.tech/about-company)). I owned **two apps with different jobs**. **Shell Garage** — a **B2B** delivery for
            the **Shell** forecourt / auto-care network: a **system notebook** for on-site **technicians** — structured jobs and **work-order** flows
            (**заказ-наряд**) in one place instead of ad-hoc paper. **ZenCar client** on **Expo** targets **car owners**: essentially a **vehicle & enthusiast diary** that
            also acts as the **bridge** into ZenCar’s **existing ecosystem products** (service journeys and partner flows). **Shell Garage** shipped on
            **React Native CLI**, the consumer client on **Expo** — **two store releases each** for **iOS & Android**. Shared stack: **Apollo**
            (GraphQL), **Realm**, **Storybook**, partial **Figma**.\n"
        - "type": "keyResults"
          "items":
            - "val": "2"
              "lbl": "Shell Garage"
            - "val": "2"
              "lbl": "ZenCar (Expo)"
            - "val": "GQL"
              "lbl": "Apollo"
        - "type": "prose"
          "text": "### Idea & context\n\n**Shell Garage** was anchored in **Shell**’s operational reality: **masters** at service points needed a
            **single digital notebook** — track work, create and progress **work orders** (**заказ-наряд**), stay aligned with back-office expectations. That
            pushed us toward **React Native CLI** for native parity and integrations. **ZenCar client** is the **consumer** complement: a **car owner’s
            diary** (maintenance notes, vehicle memory) that **connects** people to the **system products** the ZenCar stack already runs — one UX layer
            tying **“workshop-side”** and **“owner-side”** structures for the user. **Expo** fit faster iteration there while **Apollo** / **Realm**
            stayed the common backbone; **shaky forecourt Wi‑Fi** and clear loading states mattered in both worlds.\n"
        - "type": "prose"
          "text": "### Outcomes\n\n- **Shell Garage:** **B2B** app for **Shell** — technician notebook + **work orders**; **RN CLI**; **two** releases.\n- **ZenCar client:** **car / enthusiast diary** + **ecosystem entry**; **Expo**; **two** releases.\n- **ZenCar / Innopolis:** contributions across the broader auto-service product line.\n- **Data:** **Apollo** + **Realm** on both apps.\n- **Design & platform:** **Storybook**, **Figma** where I co-owned UI; **Swift / Java** only for unavoidable bridges.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Engineering notes\n\n**Shell Garage (RN CLI):** technician workflows at **Shell** sites — job lists, statuses, **work orders**;
            native shells + JS, **two** store submissions.\n\n**ZenCar client (Expo):** diary / vehicle memory surfaces and routing into **ecosystem**
            modules; **Expo** pipeline, **two** releases.\n\n**Shared:** **Apollo Client**, **Realm** for connectivity-sensitive UX, **Storybook**,
            **Figma** where applicable.\n\nProduct site: [zencar.tech](https://zencar.tech/en).\n"
