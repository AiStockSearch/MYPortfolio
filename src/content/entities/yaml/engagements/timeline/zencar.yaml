        - "type": "prose"
          "text": "**[ZenCar](https://zencar.tech/)** — экосистема автосервиса и цифровых продуктов вокруг машины (компания в **ОЭЗ «Иннополис»**, см.
            [о компании](https://zencar.tech/about-company)). Я развивал **два разных по роли приложения**. **Shell Garage** — партнёрский **B2B**-проект
            для **сети автозаправок Shell**: у мастеров на точках — **системный блокнот** вместо «бумажки», ведение работ и **оформление заказ-нарядов**
            в едином контуре. **Клиент ZenCar** на **Expo** — **потребительская** сторона: по сути **дневник автомобиля и
            автолюбителя**, который **связывает** пользователя с **системными продуктами**, уже доступными в экосистеме (сервис, обслуживание,
            партнёрские сценарии). Первое приложение — **React Native CLI**, второе — **Expo**; на **каждом** — **по два релиза** в **App Store** и
            **Google Play**. Данные и UI: **Apollo** (GraphQL), **Realm**, **Storybook**; частично **Figma**.\n"
        - "type": "keyResults"
          "items":
            - "val": "2"
              "lbl": "Shell Garage"
            - "val": "2"
              "lbl": "ZenCar (Expo)"
            - "val": "GQL"
              "lbl": "Apollo"
        - "type": "prose"
          "text": "### Идея и контекст\n\n**Shell Garage** решал прикладную задачу **бренда Shell** на автозаправках: дать мастерам **единый
            цифровой блокнот** — учёт работ, понятный поток **заказ-наряда** (создание и ведение **нарядов**), без разрыва между «полем» и бэкофисом. Технически это
            потребовало **React Native CLI** — привычный нативно-связанный контур под интеграции и стор. **Клиент ZenCar** — другая плоскость:
            не пост, а **человек с машиной** — **дневник ТО**, заметок, истории обслуживания и **точка входа** в то, что экосистема ZenCar уже
            предлагает как **системные продукты** (скрещивание «мастерской» и «личного» контура для пользователя). Здесь уместен **Expo** — быстрее
            итерации при том же стеке **Apollo** / **Realm**. В обоих случаях важны **слабая сеть** на объекте, ясные состояния загрузки и согласованный
            GraphQL-контракт.\n"
        - "type": "prose"
          "text": "### Итог и эффект\n\n- **Shell Garage:** **B2B** для **Shell** — блокнот мастера и **заказ-наряды**; **RN CLI**, **2** релиза.\n- **Клиент ZenCar:** **дневник автолюбителя** и связка с **продуктами экосистемы**; **Expo**, **2** релиза.\n- **Платформа ZenCar / ОЭЗ Иннополис:** участие в линейке продуктов вокруг авто и сервиса.\n- **Данные:** **Apollo** + **Realm** на обеих базах.\n- **Дизайн:** **Storybook**, частично **Figma**; **Swift / Java** точечно.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Техническая реализация\n\n**Shell Garage (RN CLI):** сценарии **мастера на АЗС Shell** — списки работ, статусы, **заказ-наряды**
            (оформление и сопровождение **нарядов**); нативные **iOS / Android** + JS, **два** релиза в сторы.\n\n**Клиент ZenCar (Expo):** экраны **дневника авто**,
            навигация к **продуктам экосистемы**; тот же **Apollo** / **Realm**, **Expo**-сборки — **два** релиза.\n\n**Общее:** GraphQL,
            **Realm** под офлайн-чувствительный UX, **Storybook**, **Figma**.\n\nСайт: [zencar.tech](https://zencar.tech/).\n"
