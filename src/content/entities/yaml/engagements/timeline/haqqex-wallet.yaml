          "text": "### Product idea & problem\n\n[HAQQEX](https://haqqex.com/en/) is a **Shariah-compliant** digital-asset
            exchange for **MENA** (Abu Dhabi) on [HAQQ Network](https://www.haqq.network/) (EVM-compatible L1 on Cosmos SDK)
            with **ISLM** and **Deenar Gold (DEEN)**.\n\nThe mobile client is **non-custodial**: keys and signing stay on
            device / hardware, not on the exchange server. The goal was a production path from onboarding to trading and
            cold-sign, with bank-grade security (**OWASP MASVS**) and a stable realtime trading UI.\n\nRole: **Senior Mobile /
            Web3 Mobile Architect** and Tech Lead of mobile (team up to **5**): architecture, native modules, App Store &
            Google Play releases, coordination with Backend / Web3 / DevOps.\n\n### What I built\n\n**Architecture.** Pure
            **React Native CLI** + **TypeScript**; **Yarn / pnpm Workspaces** monorepo isolating isomorphic modules (crypto,
            precision math, RPC, UI).\n\n**Web3 & hardware.** Non-custodial layer: EVM contracts, **WalletConnect v2**,
            **Ledger (BLE)** and **NFC** smart cards for cold signing. Custom **Swift / Kotlin** native modules (TurboModules
            migration) for encryption, biometrics and device hardening.\n\n**Trading UI.** Realtime candles via **TradingView**
            (WebView Bridge) and order books via **WebSocket / Socket.io** — stabilized at **60 FPS** (previously JS-thread
            freezes at peak) with custom virtualization and **Reanimated**.\n\n**Precision & quality.** **decimal.js /
            bignumber.js** for Zakat, fees and on-chain math; **TypeScript + Zod** runtime validation cut Crash Rate from
            **2.8%** to **&lt;0.1%** (crash-free **&gt;99.9%**); **Crashlytics** + **Sentry**.\n\n**Security & delivery.**
            Keychain / Keystore, FaceID/TouchID; external **penetration test** and audit passed. **CI/CD**: GitLab CI +
            Fastlane (match → TestFlight / Play Internal → stores); **TTM −25%**. Tests: Jest + Detox + XCTest/Espresso;
            visual regressions via Storybook / React Cosmos.\n\n### Outcomes\n\n- Production non-custodial client in both
            stores for MENA.\n- ~**12,000** peak active users.\n- Crash-free **&gt;99.9%**; trading UI at **60 FPS**.\n-
            Faster delivery of key trading features (**TTM −25%**).\n- Code Review standards and mobile team onboarding.\n"
