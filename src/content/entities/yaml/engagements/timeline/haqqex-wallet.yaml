        - "type": "prose"
          "text": "### Product idea & problem\n\n[HAQQEX](https://haqqex.com/en/) targets a **Sharia-aligned** digital asset
            exchange for MENA (**NDA** context): transparent rails, strong compliance, and custodial trust. The mobile app had
            to expose **one cohesive custodial journey** — from first login and identity checks through trading, treasury, and
            **Earn / vault** — while meeting **bank-grade** expectations on keys, sessions, and auditability.\n\nI led the
            **React Native** side of that bet: architecture for regulation + load, shipping to **production App Store** cycles,
            then hardening the client as the threat model matured.\n\n### What I built\n\n**Product scope.** End-to-end
            **authentication, registration, KYC & AML**; a **home** hub; **spot** trading with explicit fee semantics;
            **margin** and **futures**; **cross-chain** movements and **cross-swaps**; rich **transaction** trails;
            **Earn / vault** UX. Deposits/positions were modelled across **multiple wallet personas** inside a single custodial
            platform.\n\n**Engineering.** **React Native CLI 0.79.8**; **react-native-config** + **.env** for **prod vs dev**.
            **REST** surfaced through **RTK Query** (cache, retries, invalidation). Streaming lived in a **WebSocket singleton**
            with an **Event Emitter** fabric for cross-feature signalling. Final architecture **removed local databases**
            (**Realm/SQLite/MMKV** retired after review); orchestration used **React Context**, RTK caches, and selective
            **navigation.setParams** so sensitive drafts reset when leaving a screen. Monetary correctness via **decimal.js** and
            **BigInt**. UI discipline for **~60 FPS** charts/order books; **Reanimated 3.1** + core **Animated**; **Atomic Design**,
            **Clean Architecture**, **SOLID**, previews in **React Cosmos / Storybook**.\n\n**Security & delivery.** **PIN** +
            biometrics, secrets handling reviewed like a custodial banking app; remediation against **OWASP Mobile Top 10** /
            MAS-style assessments. **CI/CD** + **Fastlane**; **2–3** App Store drops in that generation. Later, we **sunset Ledger
            hardware flows** and **legacy keystore** surfaces to shrink attack surface and simplify custody assumptions.\n\n###
            Outcomes\n\n- A **single end-user narrative**: onboarding → compliance → trading/treasury without context switches.\n-
            **Repeatable releases** with environment discipline and automation.\n- A **reliable realtime client** (singleton WS +
            backoff/NetInfo-aware retries tuned for flaky networks).\n- **Lower long-term risk** by shedding local DB/animation
            debt that fought us on trading-critical screens.\n- **Stronger security posture** across releases and the Ledger/keystore
            migration window.\n"
        - "type": "keyResults"
          "items":
            - "val": "2–3"
              "lbl": "iOS releases"
