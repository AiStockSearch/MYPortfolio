        - "type": "prose"
          "text": "### Mobile architecture\n\n**Delivery:** RN **CLI 0.79.8**, **react-native-config** + **.env** for
            **prod vs dev** splits, **CI/CD** with **Fastlane**, and **2–3** production drops on **iOS** in that generation.\n\n**Networking
            & state:** **REST** integrations fronted with **RTK Query** (caching, retries, store slices). Streaming used a
            **WebSocket singleton** to own reconnect/backoff and fan updates into UI, complemented by an **Event Emitter** bus for
            cross-feature signalling. **NetInfo**-aware retry policies kept flows usable on unstable networks.\n\n**On-device
            persistence:** deliberately **no local database** (Realm/SQLite removed from the final approach; a short-lived
            **MMKV** spike was also retired after security review). Lightweight
            orchestration relied on **React Context** plus RTK caches; some ephemeral UI state rode **navigation.setParams** so
            navigating away **reset** local decisions without fighting deep stack history.\n\n**Numeric correctness:** **decimal.js**
            and **BigInt** to avoid floating-point corruption on balances, fees, and quantities.\n\n**UI engineering:** folder-by-feature,
            **Atomic Design**, **Clean Architecture**, **SOLID**, **React Cosmos / Storybook**, and animation work primarily via
            **Reanimated 3.1** + core **Animated** APIs with a slim third-party footprint.\n\n**Security:** **PIN**, biometrics, and
            key-storage flows reviewed against **OWASP Mobile Top 10** / MAS-style banking expectations for custodial wallets.\n"
