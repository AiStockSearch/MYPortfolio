        - "type": "prose"
          "text": "### About the project\n\n[HAQQEX](https://haqqex.com/en/) is a Web3/FinTech digital-asset exchange
            ecosystem under **Shariah-compliant** standards for **MENA** (Abu Dhabi). [HAQQ Network](https://www.haqq.network/)
            is an EVM-compatible L1 on Cosmos SDK; tokens **ISLM** and **Deenar Gold (DEEN)**. Product scale: up to ~**12,000**
            peak active users. Shipped to **App Store** and **Google Play**. Coordination with Backend / Web3 / DevOps; Tech Lead
            of mobile (team up to **5**).\n\nThe mobile client is **non-custodial**: keys and signing stay on device or hardware
            wallet, not on the exchange server. The goal was a production path from onboarding to trading and cold-sign, with
            bank-grade security (**OWASP MASVS**) and a stable realtime trading UI.\n\n**Engagement:** project / outstaff (not
            exclusive full-time). In parallel: Mirapolis (Jul 2024 — Sep 2025, GPH / part-time); Skif Trade (Aug — Dec 2025,
            project / part-time).\n\n**Unique stack:** WalletConnect v2, Ethers.js, Ledger BLE, NFC cold-sign; TradingView WebView
            Bridge; OWASP MASVS; Shariah-compliant FinTech (HAQQ / ISLM / DEEN).\n\n### Architecture leadership & monorepo\n\nDesigned and shipped
            a scalable modular architecture on pure **React Native CLI** (no Expo) + **TypeScript**: OOP, **SOLID**, **Atomic
            Design**, strict typing. Built a **Yarn / pnpm Workspaces** monorepo isolating isomorphic modules (cryptography,
            precision math, RPC clients, UI) into autonomous packages — faster parallel development and testability.\n\nCustom
            native modules in **Swift (iOS)** and **Kotlin (Android)** (TurboModules migration) for encryption, biometrics and
            device hardening — native where the JS layer is insufficient for security and latency.\n\n### Shariah-Compliant logic
            & UI/UX\n\nCustom interfaces (**styled-components** + **StyleSheet**) and business logic enforcing **Anti-Riba**
            mechanisms and exclusion of **Gharar** & **Maysir**. UI isolation and prototyping via **Storybook** and **React
            Cosmos**.\n\n### Financial precision (Math & BigInt)\n\nAbsolute precision for Islamic financial flows, **Zakat**
            calculation and on-chain transactions via **decimal.js** and **bignumber.js** — eliminated rounding errors in fees
            and on-chain operations.\n\n### Real-time trading & charts\n\nHigh-performance quote modules and dynamic order books
            via **WebSockets / Socket.io**. Seamless integration with **TradingView API** (WebView Bridge). Optimized to stable
            **60 FPS** (previously JS-thread freezes at peak order-book load) with **React.useMemo**, custom virtualization and
            **Reanimated**.\n\n### Web3, WalletConnect & hardware wallets\n\nInterfaces and cryptographic layer for a **non-custodial
            mobile wallet**: EVM smart contracts, **WalletConnect v2**, **Ledger (BLE)** and **NFC** smart cards for cold signing.\n\n###
            Security & mobile compliance\n\nSecurity architecture per **OWASP MASVS**: iOS Keychain, Android Keystore, FaceID/TouchID.
            External **penetration test** and security audit before release — passed.\n\n### Quality, CI/CD & leadership\n\n**TypeScript
            + Zod** runtime validation: Crash Rate from **2.8%** to **&lt;0.1%** (Crash-Free Sessions **&gt;99.9%**); **Firebase
            Crashlytics** and **Sentry** (alerts, release health, symbolication). Test contour: **Jest** (unit) + **Detox** (E2E
            critical flows) + **XCTest / Espresso** (native modules); visual regressions via Storybook / React Cosmos.\n\n**CI/CD**
            on **GitLab CI + Fastlane** (and **GitHub Actions / Bitrise** where needed): RN iOS/Android build, code signing (match),
            TestFlight / Google Play Internal → store promotion. With Workspaces migration — **TTM −25%** for key trading features.\n\n**Tech
            Lead:** Code Review standards and Git hygiene, mentoring, API contract design with backend, release process. **Product
            Alignment:** backlog with product and stakeholders aligned to business goals.\n\n### Outcomes\n\n- Production **non-custodial**
            client in both stores for MENA.\n- ~**12,000** peak active users.\n- Crash-free **&gt;99.9%**; trading UI at **60 FPS**.\n-
            Faster delivery of key trading features (**TTM −25%**).\n- Code Review standards, mobile team onboarding, successful security
            audit.\n"
