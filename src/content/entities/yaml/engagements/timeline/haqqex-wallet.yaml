          "text": "### Идея и продуктовая задача\n\nПлатформа [HAQQEX](https://haqqex.com/en/) — цифровой активный обмен в
            рамках исламских финансовых стандартов (MENA, **NDA**): прозрачные операции, акцент на комплаенсе и доверии
            пользователя. Мобильный клиент должен был дать **один кастодиальный контур** — от первого входа и верификации до
            торговли, казначейства и сценариев **Earn / vault**, при этом выдерживать **банковский уровень** требований к
            ключам, сессиям и аудиту.\n\nМоя роль — **ведущая инженерия RN-клиента**: от архитектуры под регуляторику и нагрузку
            торгового UI до выкладок в **App Store** и последующих волн ужесточения безопасности.\n\n### Реализация\n\n**Продукт
            и функции.** Закрыт полный контур **авторизации, регистрации, KYC и AML**; **домашний экран** как хаб операций;
            торговля **спот** (с явной комиссионной логикой), **маржа** и **фьючерсы**; **кросс-чейн** переводы и
            **кросс-свапы**; детальные **транзакции**; **Earn / vault**. Депозиты и отображение позиций унифицированы под
            разные **профили кошельков** в рамках одной кастодиальной модели.\n\n**Инженерия.** Клиент на **React Native CLI
            0.79.8**; разделение **prod/dev** через **react-native-config** и **.env**. Сеть: **REST** + **RTK Query** (кэш,
            ретраи, инвалидирование); поток котировок — **WebSocket singleton** + **Event Emitter** для межфичевых событий.
            Локальное состояние без **БД** в финале (**Realm/SQLite/MMKV** убраны из контура после аудита); **React Context**,
            кэш RTK, точечно **navigation.setParams** для сброса локального стейта при уходе со экрана. Деньги: **decimal.js** /
            **BigInt**. Навигация и живой UI: **60 FPS**-дисциплина на графиках и стакане; **Reanimated 3.1** + **Animated**;
            **Atomic Design**, **Clean Architecture**, **SOLID**, витрины в **React Cosmos / Storybook**.\n\n**Безопасность и
            доставка.** **PIN**, биометрия, хранение секретов по практикам кастодия; закрытие замечаний ревью в духе **OWASP
            Mobile Top 10**. **CI/CD** + **Fastlane**; **2–3** релиза в **App Store** на этом поколении клиента. Итоговый этап —
            **отключение Ledger** и **legacy keystore**-путей ради сокращения поверхности атаки и упрощения модели хранения.\n\n###
            Результат\n\n- Продуктовый **сквозной** опыт: onboarding → комплаенс → торговля и казначейство в одном приложении.\n-
            **Production-сборки** с предсказуемым pipeline и окружениями.\n- **Устойчивый realtime-слой** (singleton WS + политики
            reconnect/retry под сети MENA).\n- **Снижение технического долга** по локальному хранилищу и анимациям — меньше точек
            отказа на кассово-критичных экранах.\n- **Укрепление security posture** перед релизами и в ходе миграций Ledger/keystore.\n"
