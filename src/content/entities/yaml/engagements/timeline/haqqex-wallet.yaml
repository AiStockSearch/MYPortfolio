        - "type": "prose"
          "text": "### Идея и продуктовая задача\n\n[HAQQEX](https://haqqex.com/en/) — экосистема обмена цифровых активов
            в рамках **Shariah-compliant** стандартов для рынка **MENA** (Абу-Даби), блокчейн
            [HAQQ Network](https://www.haqq.network/) (EVM-compatible L1 на Cosmos SDK), токены **ISLM** и
            **Deenar Gold (DEEN)**.\n\nМобильный клиент — **некастодиальный** (non-custodial): ключи и подписи на
            устройстве / железе, без хранения сидов на сервере биржи. Нужен был production-контур от онбординга до
            торговли и cold-sign, с банковским уровнем безопасности (**OWASP MASVS**) и стабильным realtime UI.\n\nРоль —
            **Senior Mobile / Web3 Mobile Architect** и Tech Lead мобильного направления (команда до **5** инженеров):
            архитектура, native-модули, релизы в **App Store** и **Google Play**, координация с Backend / Web3 / DevOps.\n\n###
            Реализация\n\n**Архитектура.** Чистый **React Native CLI** + **TypeScript**; монорепозиторий **Yarn / pnpm
            Workspaces** с изоляцией изоморфных модулей (криптография, точность чисел, RPC, UI).\n\n**Web3 & hardware.**
            Non-custodial слой: EVM-смарт-контракты, **WalletConnect v2**, **Ledger (BLE)** и **NFC**-смарт-карты для
            холодного подписания. Кастомные native-модули на **Swift / Kotlin** (миграция на **TurboModules**) для
            шифрования, биометрии и аппаратной защиты.\n\n**Trading UI.** Realtime свечи через **TradingView** (WebView
            Bridge) и стаканы через **WebSocket / Socket.io** — доведены до стабильных **60 FPS** (ранее фризы JS-потока на
            пиках) за счёт виртуализации и **Reanimated**.\n\n**Точность и качество.** **decimal.js / bignumber.js** для
            Zakat, комиссий и on-chain; **TypeScript + Zod** runtime-валидация — Crash Rate с **2.8%** до **&lt;0.1%**
            (crash-free **&gt;99.9%**); мониторинг **Firebase Crashlytics** и **Sentry**.\n\n**Безопасность и доставка.**
            Keychain / Keystore, FaceID/TouchID; внешний **penetration-тест** и аудит — пройдены. **CI/CD**: GitLab CI +
            Fastlane (match → TestFlight / Play Internal → сторы); **TTM −25%**. Тесты: Jest + Detox + XCTest/Espresso;
            визуальные регрессии через Storybook / React Cosmos.\n\n### Результат\n\n- Production non-custodial клиент в
            обоих сторах для MENA.\n- ~**12 000** активных пользователей в пике.\n- Crash-free **&gt;99.9%**; торговый UI
            **60 FPS**.\n- Ускорение поставки ключевых торговых фич (**TTM −25%**).\n- Стандарты Code Review и онбординг
            мобильной команды.\n"
