        - "type": "prose"
          "text": "### О проекте\n\n[HAQQEX](https://haqqex.com/en/) — Web3/FinTech экосистема обмена
            цифровых активов в рамках **Shariah-compliant** стандартов для рынка **MENA** (Абу-Даби). Блокчейн
            [HAQQ Network](https://www.haqq.network/) — EVM-compatible L1 на Cosmos SDK; токены **ISLM** и
            **Deenar Gold (DEEN)**. Масштаб продукта: до ~**12 000** активных пользователей в пике. Релиз в
            **App Store** и **Google Play**. Координация с Backend / Web3 / DevOps; Tech Lead мобильного направления
            (команда до **5** инженеров).\n\nМобильный клиент — **некастодиальный** (non-custodial): ключи и подписи
            остаются на устройстве или аппаратном кошельке, без хранения сид-фраз на сервере биржи. Нужен был
            production-контур от онбординга до торговли и cold-sign, с банковским уровнем безопасности
            (**OWASP MASVS**) и стабильным realtime trading UI.\n\n**Формат:** проектный контракт / Outstaff (не exclusive
            full-time). Параллельно: Мираполис (июл 2024 — сен 2025, ГПХ / part-time); Скиф Трейд (авг — дек 2025,
            проект / part-time).\n\n**Уникальный стек:** WalletConnect v2, Ethers.js, Ledger BLE, NFC cold-sign;
            TradingView WebView Bridge; OWASP MASVS; Shariah-compliant FinTech (HAQQ / ISLM / DEEN).\n\n###
            Архитектурное лидерство и монорепозиторий\n\nСпроектировал и довёл до
            релиза масштабируемую модульную архитектуру на **чистом React Native CLI** (без Expo) + **TypeScript**:
            ООП, **SOLID**, **Atomic Design**, строгий контроль типов. Организовал **Yarn / pnpm Workspaces**
            монорепозиторий с переводом общих изоморфных модулей (криптография, точность чисел, RPC-клиенты, UI) в
            автономные пакеты — ускорила параллельную разработку и тестируемость.\n\nНаписал кастомные native-модули на
            **Swift (iOS)** и **Kotlin (Android)** (миграция на **TurboModules**) для шифрования, биометрии и аппаратной
            защиты устройства — осознанный выбор native там, где JS-слой недостаточен по безопасности и latency.\n\n###
            Shariah-Compliant логика и UI/UX\n\nРазработал кастомные интерфейсы (**styled-components** + **StyleSheet**)
            и бизнес-логику для строгого соблюдения этических стандартов: **Anti-Riba** механизмы, исключение
            **Gharar** и **Maysir**. Изоляция и прототипирование UI-компонентов через **Storybook** и **React Cosmos**.\n\n###
            Финансовая точность (Math & BigInt)\n\nОбеспечил абсолютную точность при работе со сложными исламскими
            финансовыми потоками, расчётом **Zakat** и блокчейн-транзакциями за счёт **decimal.js** и **bignumber.js** —
            исключены ошибки округления в комиссиях и on-chain операциях.\n\n### Real-time Trading и графики\n\nИнтегрировал
            высокопроизводительные модули котировок и динамических торговых стаканов (Order Book) через **WebSockets /
            Socket.io**. Бесшовное взаимодействие с интерактивными графиками через **TradingView API** (WebView Bridge).
            Оптимизировал до стабильных **60 FPS** (ранее — фризы JS-потока при пиковой нагрузке стакана) за счёт
            **React.useMemo**, кастомной виртуализации и **Reanimated**.\n\n### Web3, WalletConnect и Hardware Wallets\n\nРеализовал
            интерфейсы и криптографический слой для **non-custodial mobile wallet**: EVM-смарт-контракты, **WalletConnect v2**,
            **Ledger (BLE)** и **NFC**-смарт-карты для холодного подписания.\n\n### Security и мобильный комплаенс\n\nАрхитектура
            безопасности в соответствии с **OWASP MASVS**: iOS Keychain, Android Keystore, FaceID/TouchID. Внешний
            **penetration-тест** и аудит безопасности перед релизом — пройдены успешно.\n\n### Качество, CI/CD и лидерство\n\n**TypeScript
            + Zod** runtime-валидация: Crash Rate с **2.8%** до **&lt;0.1%** (Crash-Free Sessions **&gt;99.9%**); мониторинг
            **Firebase Crashlytics** и **Sentry** (алерты, release health, symbolication). Тестовый контур: **Jest** (unit) +
            **Detox** (E2E критичных флоу) + **XCTest / Espresso** (native-модули); визуальные регрессии через Storybook /
            React Cosmos.\n\n**CI/CD** на базе **GitLab CI + Fastlane** (и при необходимости **GitHub Actions / Bitrise**):
            автосборка RN iOS/Android, code signing (match), TestFlight / Google Play Internal → промоушен в сторы. Вместе с
            миграцией на Workspaces — **TTM −25%** ключевых торговых фич.\n\n**Tech Lead:** Code Review и гигиена Git,
            менторинг, проектирование API-контрактов с бэкендом, релизный процесс. **Product Alignment:** бэклог с продуктом
            и заказчиками с учётом бизнес-целей.\n\n### Результат\n\n- Production **non-custodial** клиент в обоих сторах для
            MENA.\n- ~**12 000** активных пользователей в пике.\n- Crash-free **&gt;99.9%**; торговый UI **60 FPS**.\n- Ускорение
            поставки ключевых торговых фич (**TTM −25%**).\n- Стандарты Code Review, онбординг мобильной команды, успешный
            security audit.\n"
