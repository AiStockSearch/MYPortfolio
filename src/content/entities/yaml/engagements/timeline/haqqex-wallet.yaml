          "text": "### Архитектура RN-клиента\n\n**Сборка и окружения:** React Native **CLI 0.79.8**, раздельные конфигурации
            **prod/dev** через **react-native-config** и **.env**. **CI/CD** и **Fastlane** для выкладок; на этом поколении
            клиента — **2–3** релиза в **App Store**.\n\n**Данные и сеть:** основной контракт с бэкендом — **REST**;
            серверное состояние и кэш — **RTK Query** (ретраи, инвалидции, нормализованные сторы). Поток котировок и
            событий биржи — **WebSocket в паттерне Singleton** (единая точка жизненного цикла, переподключение, fan-out в UI)
            плюс **Event Emitter** для кросс-модульной сигнализации без жёсткой связности. **NetInfo** и политика **retry**
            под реалии сетей MENA.\n\n**Состояние на устройстве:** без **локальной БД** (Realm/SQLite в финальном контуре не
            использовались; ранний **MMKV**-след по проекту сведён к нулю после аудита — в финале без key-value DB на
            клиенте). Оркестрация через **React Context** и кэш RTK Query. Часть экранного стейта умышленно жила в
            **navigation.setParams**, чтобы при выходе со страницы **сбрасывать** локальные решения без борьбы с глубокой
            историей **React Navigation**.\n\n**Точность денег:** **decimal.js** и **BigInt** — без «плавающей» арифметики на
            балансах и ордерах.\n\n**UI/инженерия:** folder-by-feature, **Atomic Design**, **Clean Architecture**, **SOLID**;
            **React Cosmos / Storybook**; анимации на **Reanimated 3.1** и **RN Animated** с минимальным набором сторонних
            обёрток.\n\n**Безопасность:** **PIN**, биометрия, хранение секретов с ориентиром на банковские практики;
            закрытие замечаний в духе **OWASP Mobile Top 10** / mobile security assessment для кастодиального приложения.\n"
