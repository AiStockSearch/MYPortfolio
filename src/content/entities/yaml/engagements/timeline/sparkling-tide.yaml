  "en": "**Spark Lite** (SparklingTide): RN **services marketplace** — listings, geo, payments; fast MVP to **stores**;
    analytics & crash tooling; **Jest / Maestro / Cypress** E2E."
  "ru": "**Spark Lite**: **маркетплейс услуг** на RN — объявления, гео, оплаты; быстрый MVP до **сторов**; аналитика и
