        - "type": "prose"
          "text": "Мобильная HCM/LMS для Mirapolis: плеер курсов, офлайн-обучение, тестирование, лента и медиатека —
            адаптивный UI в том числе для **планшетов**, на которых удобно работать руководителям **в полях**. Приложение
            обслуживает **100k+** корпоративных пользователей в России в модели **enterprise** (SSO, white-label модули,
            большие списки сотрудников и курсов).\n"
        - "type": "keyResults"
          "items":
            - "val": "+15%"
              "lbl": "DAU обучения"
            - "val": "-40%"
              "lbl": "Память списков"
            - "val": "100k+"
              "lbl": "Аудитория"
        - "type": "prose"
          "text": "### Идея и контекст\n\n[Mirapolis](https://www.mirapolis.ru/) — HCM/LMS-платформа для крупных организаций:
            обучение, оценки, коммуникации и HR-процессы в одном контуре. **Идея мобильного клиента** — дать сотруднику **тот же
            учебный контракт**, что и в вебе, но в дороге и **без гарантированной сети**: курсы должны **докачиваться**, проходиться
            офлайн и **корректно синхронизироваться** при возвращении связи.\n\nВторая оверлейная задача — **enterprise-реальность**:
            **SSO** и граничные кейсы входа, **white-label** для разных заказчиков, **тяжёлые списки** людей и курсов на слабом
            Android и **планшетный** режим для руководителей.\n"
        - "type": "prose"
          "text": "### Итог и эффект\n\n- **Вовлечённость:** после переработки **offline** и сценариев обучения — рост **DAU мобильного
            обучения ~+15%**.\n- **Производительность:** виртуализированные списки (**Virtual Lists**) и дисциплина рендера — ориентир
            **−40% потребления памяти** на типичных списках сотрудников/курсов.\n- **Масштаб:** поддержка **100k+** пользователей и корпоративных
            сценариев без «падения» на листинге.\n- **Платформа:** миграция на **React 18+** и **TypeScript** на легаси-участках — меньше класса
            регрессий при релизах.\n- **UX:** адаптив под **iPad / Android-планшеты** для полевых руководителей; ядро LMS — плеер, тесты,
            новости, медиатека.\n- **Интеграции:** **REST** и **real-time** к ядру HCM/LMS; отработка **конфликтов синка** и больших объёмов
            данных.\n- **Команда:** **code review**, стандарты, наставничество **Middle/Junior**.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "Ключевая задача — offline-first: курсы без сети в полях. Кастомный движок синхронизации с разрешением конфликтов, дельта-обновления, фоновый sync. Virtual Lists снизили память на 40% на слабых Android. Модульность для white-label клиентов.\n"
