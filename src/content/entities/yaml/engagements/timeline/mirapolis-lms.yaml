        - "type": "prose"
          "text": "### О проекте\n\n[Mirapolis](https://www.mirapolis.ru/) — Enterprise-платформа мобильной экосистемы
            **HCM & LMS** для крупных корпоративных клиентов: HR, обучение, оценка персонала, внутренние коммуникации.
            Мобильный клиент — **White-Label / Dynamic UI** под процессы заказчика. **Масштаб:** до ~**12 000** пользователей
            мобильного клиента в пике.\n\n**Роль:** **Core Module Lead** мобильного ядра. **Формат:** трудовой договор / **ГПХ ·
            совмещение · part-time**, не exclusive full-time.\n\n**Параллельные контракты:** весь срок (июл 2024 — сен 2025) —
            outstaff **haqqex**; авг — сен 2025 — дополнительно проект **Скиф Трейд** (совмещение / part-time). Перекрытие авг–сен
            2025 — осознанное совмещение трёх договоров.\n\n**Уникальный стек проекта:** SCORM / xAPI плеер (WebView JS Bridge);
            Configuration-driven UI (JSON-схемы); FlashList / RecyclerListView; FSM тестов LMS; Tablet Master-Detail / Split View.\n\n###
            Enterprise-архитектура и монорепозиторий\n\nПроектирование и
            развитие масштабируемого ядра на **чистом React Native CLI** + **TypeScript**, **Clean Architecture**, **SOLID**,
            **Atomic Design**. Монорепозиторий **Yarn / pnpm Workspaces** с разделением на изоморфные модули и выделением
            core-библиотек.\n\n### Core-функционал LMS и плеер курсов\n\nСоздал кроссплатформенный плеер интерактивных обучающих
            курсов (**SCORM / xAPI**) на глубоко оптимизированном React Native **WebView** с двусторонним **JS Bridge**. Логика
            тестов на **FSM** (конечные автоматы) с защитой состояния при сбоях сети — прогресс и ответы не теряются при обрыве
            связи.\n\n### Configuration-driven UI и стилизация\n\nКастомные компоненты на **styled-components** и **StyleSheet**.
            Движок, который на основе конфигурационных **JSON-схем** с бэкенда динамически формирует ленту корпоративных новостей
            и виджеты — **без релизов в App Store / Google Play** при смене корпоративного UI.\n\n### Offline-First движок\n\nПолностью
            переработал автономный режим курсов и тестов: локальное хранилище + очереди синхронизации прогресса и аналитики.
            **DAU мобильного обучения +15%** — командная метрика продукта.\n\n### Zero Lag — оптимизация списков\n\nОптимизировал
            отрисовку тяжёлых корпоративных справочников и каталогов курсов (тысячи элементов со сложной иерархией). Переход на
            **FlashList / RecyclerListView**, кастомное кэширование изображений, минимизация избыточных рендеров — стабильные
            **60 FPS** даже на low-end устройствах с жёстким ограничением RAM.\n\n### Tablet UX (Split View)\n\n**Master-Detail
            (Split View)** для iPad и Android Tablets — полноценный HR-опыт «в полях» для топ-менеджмента без компромиссов
            мобильной версии.\n\n### Поставка и качество\n\n**Storybook**, контрактное программирование, **Jest + Detox** в CI.
            Релизный контур **GitLab CI + Fastlane** (автосборка, подпись, доставка в TestFlight / Google Play Internal) —
            **TTM −25%**, меньше ручных релизов и регрессий. Мониторинг: **Firebase Crashlytics / Sentry**.\n\n### Результат\n\n-
            Флагманская Enterprise-платформа Mirapolis с production mobile core.\n- **DAU мобильного обучения +15%** после Offline-First.\n-
            Каталоги и справочники на **60 FPS** (low-end).\n- Dynamic UI без store releases; планшетный Split View.\n- **TTM −25%**
            за счёт CI/CD и контрактного UI.\n"
