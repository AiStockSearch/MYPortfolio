        - "type": "prose"
          "text": "### Идея и контекст\n\n[Mirapolis](https://www.mirapolis.ru/) — Enterprise HCM & LMS для крупных
            корпоративных клиентов: HR, обучение, оценка персонала, внутренние коммуникации. Мобильный клиент —
            White-Label / Dynamic UI под процессы заказчика. Масштаб: до ~**12 000** пользователей мобильного клиента в
            пике.\n\nРоль — **Core Module Lead** мобильного ядра (ГПХ / совмещение, июл 2024 — сен 2025): развитие
            флагманской платформы, плеер курсов, offline и планшетный UX.\n\n### Реализация\n\n**Плеер LMS.**
            Кроссплатформенный плеер интерактивных курсов (**SCORM / xAPI**) на оптимизированном React Native WebView с
            двусторонним **JS Bridge**. Логика тестов на **FSM** с защитой состояния при сбоях сети.\n\n**Offline-First.**
            Полностью переработан автономный режим курсов и тестов (локальное хранилище + очереди синхронизации прогресса /
            аналитики) — **DAU мобильного обучения +15%** (командная метрика продукта).\n\n**Производительность.** Тяжёлые
            корпоративные справочники и каталоги курсов (тысячи элементов) через **FlashList / RecyclerListView**, кастомный
            кэш изображений и минимизацию рендеров — стабильные **60 FPS** даже на low-end с жёстким лимитом RAM.\n\n**Dynamic
            UI & планшеты.** Configuration-driven UI по JSON-схемам с бэкенда без релизов в сторы. **Master-Detail / Split
            View** для iPad и Android Tablets — HR-опыт «в полях» для топ-менеджмента.\n\n**Платформа и поставка.** Монорепо
            Yarn / pnpm Workspaces, Clean Architecture + SOLID + Atomic Design. Storybook, контрактное программирование,
            Jest + Detox в CI; GitLab CI + Fastlane → TestFlight / Play Internal — **TTM −25%**. Мониторинг: Crashlytics /
            Sentry.\n"
