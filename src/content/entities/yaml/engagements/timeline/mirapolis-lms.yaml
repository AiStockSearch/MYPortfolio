          "text": "### Idea & context\n\n[Mirapolis](https://www.mirapolis.ru/) is an Enterprise **HCM & LMS** mobile ecosystem
            for large corporate clients: HR, learning, personnel assessment, internal communications. The mobile client is
            **White-Label / Dynamic UI** per customer processes. **Scale:** up to ~**12,000** peak mobile users.\n\n**Role:**
            **Core Module Lead** of the mobile core. **Engagement:** employment contract / **GPH · part-time**, not exclusive
            full-time.\n\n**Parallel contracts:** entire tenure (Jul 2024 — Sep 2025) — outstaff **haqqex**; Aug — Sep 2025 —
            additionally **Skif Trade** project (part-time / совмещение). Aug–Sep 2025 overlap — three concurrent part-time
            contracts.\n\n### Enterprise architecture & monorepo\n\nDesigned and evolved a scalable mobile core on pure **React Native
            CLI** + **TypeScript**, **Clean Architecture**, **SOLID**, **Atomic Design**. **Yarn / pnpm Workspaces** monorepo with
            isomorphic modules and extracted core libraries.\n\n### LMS core & course player\n\nBuilt a cross-platform interactive
            course player (**SCORM / xAPI**) on a deeply optimized React Native **WebView** with bidirectional **JS Bridge**. Assessment
            logic on an **FSM** with state protection on network drops — progress and answers survive connectivity loss.\n\n### Configuration-driven
            UI & styling\n\nCustom components on **styled-components** and **StyleSheet**. An engine that dynamically builds corporate
            news feeds and widgets from backend **JSON schemas** — **no App Store / Google Play releases** when corporate UI changes.\n\n###
            Offline-First engine\n\nFully reworked autonomous mode for courses and tests: local storage + sync queues for progress and
            analytics. **Mobile learning DAU +15%** — team product metric.\n\n### Zero Lag — list optimization\n\nOptimized rendering of
            heavy enterprise directories and course catalogs (thousands of items with complex hierarchy). **FlashList / RecyclerListView**,
            custom image caching, render discipline — stable **60 FPS** even on low-end devices with tight RAM.\n\n### Tablet UX (Split View)\n\n**Master-Detail
            (Split View)** for iPad and Android tablets — full field HR experience for senior management without mobile compromises.\n\n###
            Delivery & quality\n\n**Storybook**, contract programming, **Jest + Detox** in CI. Release path **GitLab CI + Fastlane** (auto-build,
            signing, TestFlight / Google Play Internal) — **TTM −25%**, fewer manual releases and regressions. Monitoring: **Firebase Crashlytics
            / Sentry**.\n\n### Outcomes\n\n- Flagship Mirapolis Enterprise platform with production mobile core.\n- **Mobile learning DAU +15%**
            after Offline-First rework.\n- Catalogs and directories at **60 FPS** (low-end).\n- Dynamic UI without store releases; tablet Split View.\n-
            **TTM −25%** via CI/CD and contract-driven UI.\n"
