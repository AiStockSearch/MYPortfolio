          "src": "/projects/mirapolis-lms.svg"
          "alt": "Mirapolis LMS"
        - "type": "section"
          "sectionKey": "overview"
        - "type": "prose"
          "text": "Mobile HCM/LMS for Mirapolis: course player, **offline** learning, assessments, news feed and media library —
            with adaptive UI for **tablets** so managers **in the field** can work comfortably. The app serves **100k+** corporate
            users across Russia under **enterprise** constraints (SSO, white-label modules, very large employee/course lists).\n"
        - "type": "keyResults"
          "items":
            - "val": "+15%"
              "lbl": "Learning DAU"
            - "val": "-40%"
              "lbl": "List memory"
            - "val": "100k+"
              "lbl": "Audience"
        - "type": "prose"
          "text": "### Idea & context\n\n[Mirapolis](https://www.mirapolis.ru/) is an HCM/LMS suite for large organizations — learning,
            assessments, comms and HR workflows in one stack. The **mobile bet** was to deliver the **same learning contract** as the web,
            including **on the move** and **without reliable connectivity**: courses must **prefetch**, run **offline**, and **reconcile
            cleanly** when the network returns.\n\nLayer two was **enterprise reality**: **SSO** edge cases, **white-label** variance per
            customer, **massive lists** of people/courses on low-end Android, plus a **tablet-first** lane for line managers.\n"
        - "type": "prose"
          "text": "### Outcomes\n\n- **Engagement:** after the **offline** / learning-flow overhaul, **mobile learning DAU ~+15%**.\n- **Performance:** **Virtual Lists** + render discipline targeted **~40% lower memory** on employee/course listings.\n- **Scale:** stable UX for **100k+** users and enterprise list sizes.\n- **Platform health:** **React 18+** migration and
            **TypeScript** adoption on legacy areas — fewer release regressions.\n- **UX:** adaptive **iPad / Android tablet** layouts for field
            managers; core LMS modules — player, testing, news, media.\n- **Integrations:** **REST** + **real-time** touchpoints to the HCM/LMS
            core; **sync conflict** handling at large data volumes.\n- **Team:** **code review**, standards, mentoring **Middle/Junior**
            engineers.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "Core challenge was offline-first architecture: employees in field locations needed to download and complete courses without internet. Built a custom sync engine with conflict resolution, delta updates and background sync. Virtual Lists optimisation cut memory usage by 40% on low-end Android devices. Modular architecture allows white-label customisation per enterprise client.\n"
