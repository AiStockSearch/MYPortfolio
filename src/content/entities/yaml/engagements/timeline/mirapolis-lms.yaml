        - "type": "prose"
          "text": "### Idea & context\n\n[Mirapolis](https://www.mirapolis.ru/) is an Enterprise HCM & LMS for large corporate
            clients: HR, learning, assessments, internal communications. The mobile client is White-Label / Dynamic UI per
            customer processes. Scale: up to ~**12,000** peak mobile users.\n\nRole: **Core Module Lead** of the mobile core
            (GPH / part-time, Jul 2024 — Sep 2025): flagship platform, course player, offline and tablet UX.\n\n### What I
            built\n\n**LMS player.** Cross-platform interactive course player (**SCORM / xAPI**) on an optimized React Native
            WebView with bidirectional **JS Bridge**. Assessment logic on an **FSM** with state protection on network
            drops.\n\n**Offline-First.** Fully reworked autonomous mode for courses and tests (local storage + sync queues for
            progress / analytics) — **mobile learning DAU +15%** (team product metric).\n\n**Performance.** Heavy enterprise
            directories and course catalogs (thousands of items) via **FlashList / RecyclerListView**, custom image cache and
            render discipline — stable **60 FPS** even on low-end devices with tight RAM limits.\n\n**Dynamic UI & tablets.**
            Configuration-driven UI from backend JSON schemas without store releases. **Master-Detail / Split View** for iPad
            and Android tablets — field HR experience for senior managers.\n\n**Platform & delivery.** Yarn / pnpm Workspaces
            monorepo, Clean Architecture + SOLID + Atomic Design. Storybook, contract programming, Jest + Detox in CI; GitLab
            CI + Fastlane → TestFlight / Play Internal — **TTM −25%**. Monitoring: Crashlytics / Sentry.\n"
