        - "type": "prose"
          "text": "Bizonex is a venue for trading crypto, DeFi tokens and tokenized assets (see the
            [company profile on Habr Career](https://career.habr.com/companies/bizonex)). I worked across the
            **Node.js SSR/BFF layer** (Express + Apollo) and the product client with real-time delivery.\n\nMy scope:\n\n- **SSR & performance**:
            migrated the product to <span class='m'>SSR</span>, tuned rendering/hydration, and enforced predictable
            state management (Redux) and DOM performance practices.\n- **GraphQL surface**:
            built a modular schema with <span class='m'>graphql-modules</span>, kept the API boundary explicit and
            security-oriented, and supported evolution without a tangled dependency graph.\n- **Real-time**:
            implemented client-side subscriptions and a <span class='m'>WebSocket</span> transport layer (auth,
            reconnections, consistency under network flaps, UX-friendly degradation).\n- **Python/<span class='m'>asyncio</span> core**:
            delivered a referral network from scratch inside the existing core and wired it for live updates.\n- **Docker & wallet ops**:
            containerized wallet stacks, automated wallet bring-up / connectivity, and rolled out to trusted
            cloud hosts using SSH keys.\n- **Access control**:
            API keys plus registration/auth flows with signature verification for market makers and external API consumers.\n"
        - "type": "keyResults"
          "items":
            - "val": "SSR"
              "lbl": "Migration & stable rendering"
            - "val": "WS"
              "lbl": "Live client transport"
            - "val": "Docker"
              "lbl": "Wallet environments"
        - "type": "prose"
          "text": "### Idea & context\n\n[Bizonex](https://bizonex.com/) is built around trading crypto, DeFi tokens and
            tokenized assets — retail users and **professional participants** (market makers, API consumers) were meant to live in
            **one product surface**. The web layer had to stay **fast and predictable** with **live markets** while still winning SEO
            and first paint — hence the hard bet on **SSR** and disciplined client state.\n\nEngineering-wise my job was to **glue**
            the Node/BFF (**Express + Apollo**), modular **GraphQL**, **WebSocket** transport, and **Python/asyncio** extensions so
            referral + trading domains received a **coherent event stream**, while wallet infrastructure stayed **reproducible** across
            environments.\n"
        - "type": "prose"
          "text": "### Outcomes\n\n- **Product:** the <span class='m'>SSR</span> migration and the **Webpack 4 / React / Redux /
            Ramda** stack reduced SSR/CSR drift across marketing and trading journeys.\n- **API & realtime:** <span class='m'>graphql-modules</span>
            + subscriptions over **WebSocket** kept quotes and referral stats live without ad-hoc polling hacks.\n- **Core:** a **greenfield**
            referral mesh on **asyncio** with live propagation became a measurable growth lever.\n- **Infra:** **Docker**-ized wallet stacks
            and **SSH**-driven rollout to trusted hosts cut one-off server drift.\n- **Access:** API keys + **signature** flows for MM/API
            consumers tightened the integration perimeter.\n\nNet: a **single** technical backbone for an early-stage exchange spanning
            public web and partner APIs. Company context: [Habr Career](https://career.habr.com/companies/bizonex).\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Architecture & implementation details\n\n**Front & SSR (Node.js):** Webpack 4, React, classic Redux,
            Ramda; mixed TypeScript & JavaScript; i18n; DOM performance tuning and SSR/CSR correctness.\n\n**GraphQL:**
            Apollo Server on Express with <span class='m'>graphql-modules</span> for schema modularization and domain isolation;
            subscriptions; explicit access control at context/resolver layers; a lean dependency graph.\n\n**Real-time:**
            WebSocket transport on the client: channel auth, reconnection strategy, state reconciliation after disconnects,
            and UX-oriented fallbacks under burst updates.\n\n**Python core (asyncio):**
            feature delivery inside the legacy core: referral network + real-time propagation.\n\n**Infrastructure:**
            Docker for reproducible wallet environments; SSH-based operations for deployments to trusted cloud hosts.\n\nProduct site:
            [bizonex.com](https://bizonex.com/).\n"
