        - "type": "prose"
          "text": "Bizonex — площадка для торговли криптовалютами, DeFi-токенами и токенизированными активами
            ([профиль на Хабр Карьере](https://career.habr.com/companies/bizonex)). Я работал на стыке **SSR/BFF
            слоя на Node.js** (Express + Apollo) и продуктового клиента с real-time.\n\nМоя зона ответственности
            включала:\n\n- **SSR и производительность**: перенос веб-продукта на <span class='m'>SSR</span>,
            настройка инфраструктуры рендера, контроль TTFB/гидратации, дисциплина по состоянию (Redux) и
            работе с DOM.\n- **GraphQL-слой**: модульная структура схемы (<span class='m'>graphql-modules</span>),
            безопасная интеграция резолверов и прозрачное разделение доменов в API.\n- **Real-time**: клиентские
            подписки и транспорт поверх <span class='m'>WebSocket</span> (поддержка авторизации/переподключений,
            устойчивость к сетевым сбоям, согласованность данных в UI).\n- **Python/<span class='m'>asyncio</span>
            в ядре**: реализовал реферальную сеть «с нуля» в существующем core, включая live-обновления
            статистики/событий.\n- **Docker и кошельки**: поднимал crypto-wallet окружения в Docker, автоматизировал
            подключение/инициализацию кошельков и разворачивание в облаке на доверенных хостах по SSH-ключам.\n- **Доступ
            и безопасность**: API-ключи и сценарии регистрации/авторизации с проверкой подписи для маркет-мейкеров и внешних
            потребителей API.\n\nЭтот этап сильно прокачал практику «продуктового real-time»: от транспорта и авторизации до
            UX-части, где данные должны обновляться быстро и без артефактов.\n"
        - "type": "keyResults"
