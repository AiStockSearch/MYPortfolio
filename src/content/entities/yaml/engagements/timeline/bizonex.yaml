        - "type": "prose"
          "text": "### Идея и контекст\n\n[Площадка Bizonex](https://bizonex.com/) — торговля криптовалютами, DeFi-токенами и
            токенизированными активами; ординарный пользователь и **профессиональные участники** (маркет-мейкеры, API-клиенты)
            должны были работать в **одном продуктовом контуре**. Идея веб-части — дать **быструю, предсказуемую** витрину и
            торговый интерфейс с **живыми котировками**, не жертвуя SEO и первым экраном: отсюда упор на **SSR** и дисциплину
            состояния на клиенте.\n\nЗадача инженерии на моей стороне — **сшить** Node/BFF (**Express + Apollo**), модульный **GraphQL**,
            **WebSocket**-транспорт и доработки **Python/asyncio** в ядре так, чтобы реферальная и торговая логика получала **поток
            событий**, а инфраструктура кошельков оставалась **воспроизводимой**.\n"
        - "type": "prose"
          "text": "### Итог и эффект\n\n- **Продукт:** перенос на <span class='m'>SSR</span> и выровненный стек **Webpack 4 / React /
            Redux / Ramda** — витрина и торговые сценарии с меньшим количеством «дрейфа» между серверным и клиентским рендером.\n-
            **API и real-time:** <span class='m'>graphql-modules</span> и подписки поверх **WebSocket** — котировки и реферальная
            статистика обновляются в UI без ручных костылей.\n- **Ядро:** реферальная сеть **с нуля** на **asyncio** с live-обновлениями
            — отдельный продуктовый рычаг роста.\n- **Инфра:** **Docker** для crypto-wallet окружений и выкладка на доверенные ноды по
            **SSH** — меньше ручных расхождений между средами.\n- **Доступ:** ключи и **подпись** в потоках MM/API-потребителей —
            контролируемый периметр для партнёрских интеграций.\n\nВ сумме — **единая** техническая база под биржевой продукт ранней
            стадии: от публичного сайта до кастомных API-клиентов. Контекст компании — [Хабр Карьера](https://career.habr.com/companies/bizonex).\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Архитектура и стек\n\n**Фронт и SSR (Node.js):** Webpack 4, React, классический Redux, Ramda;
            TypeScript и JavaScript; i18n; внимание к DOM-производительности и предсказуемости состояния при SSR/CSR.\n\n**GraphQL:**
            Apollo Server + Express; <span class='m'>graphql-modules</span> для модульной схемы и изоляции доменов;
            подписки; контроль доступа на уровне контекста и резолверов; минимальный и управляемый dependency graph.\n\n**Real-time:**
            WebSocket-транспорт на клиенте: авторизация канала, обработка переподключений, синхронизация состояния при
            разрывах, «мягкие» деградации UI и защита от рассинхронизации при burst-обновлениях.\n\n**Python core (asyncio):**
            доработки в существующем ядре: реферальная сеть, real-time обновления, интеграция событий в общий поток системы.\n\n**Инфраструктура:**
            Docker для воспроизводимого подъёма кошельков и вспомогательных сервисов; операции на доверенных хостах в облаке
            через SSH-ключи; ориентация на воспроизводимость окружения и минимизацию ручных шагов.\n\nПубличный сайт продукта:
            [bizonex.com](https://bizonex.com/).\n"
