        - "type": "prose"
          "text": "**[HAWEX Wallet](https://hawex.com/hawexwallet)** — мобильный клиент на **React Native** в экосистеме **[Hawex Group](https://ru.linkedin.com/company/hawex?trk=ppro_cprof)**:
            финтех и **платёжная инфраструктура** (счета, обработка платежей, KYC/AML в портфеле компании). Приложение закрывает практический
            сценарий **расчётов с зарубежными контрагентами через криптокошелёк**: управление ключами, **real-time** история операций,
            мультисетевые интеграции, отправка и контроль балансов в UX, пригодном для бизнес-пользователя. **Pixel-perfect** по **Figma**,
            упор на перф на тяжёлых списках. **🥈 Web3 Hackathon 2023**.\n"
        - "type": "keyResults"
          "items":
            - "val": "+40%"
              "lbl": "UI perf"
            - "val": "🥈"
              "lbl": "Хакатон"
            - "val": "RN"
              "lbl": "iOS + Android"
        - "type": "prose"
          "text": "### Идея и контекст\n\n**Hawex** позиционируется как финансовая/платёжная компания: обработка платежей, счета, KYC/AML,
            сопровождение финансового бизнеса — в том числе **крипто-обработка** в линейке услуг (см.
            [профиль компании на LinkedIn](https://ru.linkedin.com/company/hawex?trk=ppro_cprof)). **HAWEX Wallet** — мобильный слой,
            который переводит этот контекст в конкретный пользовательский сценарий: **расчёты с иностранными контрагентами** и сопутствующие
            операции **через криптокошелёк**, с понятной историей, статусами и безопасной работой с ключами.\n\nИнженерная задача — не «игрушечный
            кошелёк», а **production-ready** клиент: HD/BIP39, подпись, мультисеть, перф и **релизы в сторах**. Внешняя валидация — **🥈 Web3
            Hackathon 2023**.\n"
        - "type": "prose"
          "text": "### Итог и эффект\n\n- **Продуктовый фокус:** клиент заточен под **трансграничные расчёты и работу с контрагентами** на
            крипто-рейсах внутри бренда Hawex, а не как абстрактный «демо-кошелёк».\n- **Перфоманс:** **RTK Query** и дисциплина рендера — ориентир
            **+40%** отклика тяжёлого UI.\n- **Дизайн:** **pixel-perfect** **Figma** на **iOS и Android**.\n- **Крипто-слой:** **HD**, **BIP39**,
            подпись и **broadcast**, балансы и история в **нескольких сетях**.\n- **Доставка:** **Fastlane** + **CI/CD** для **App Store / Google Play**.\n- **Команда:** архитектурная документация и **code review**.\n- **Признание:** **🥈 Web3 Hackathon 2023**.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Техническая реализация\n\n**Кошелёк и сценарии расчётов:** **HD Wallet**, **BIP39**, подпись и **broadcast** в
            нескольких сетях; балансы и **история операций**, критичные для **прозрачности** трансграничных выплат и сверок с контрагентами.\n\n**Клиент:**
            **React Native**, **TypeScript**, **Redux** + **RTK Query**; анимации балансов и дисциплина списков под нагрузкой.\n\n**Релизы:**
            **CI/CD** и **Fastlane**. Продукт: [hawex.com/hawexwallet](https://hawex.com/hawexwallet); о компании см.
            [LinkedIn — Hawex Group LTD](https://ru.linkedin.com/company/hawex?trk=ppro_cprof).\n"
