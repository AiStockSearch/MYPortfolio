        - "type": "section"
          "sectionKey": "overview"
        - "type": "prose"
          "text": "**[HAWEX Wallet](https://hawex.com/hawexwallet)** is the **React Native** mobile client in the **[Hawex Group](https://ru.linkedin.com/company/hawex?trk=ppro_cprof)**
            ecosystem: **finTech / payment infrastructure** (accounts, payment processing, KYC/AML in the company’s portfolio). The app
            targets **settlements with foreign contractors via a crypto wallet** — key handling, **real-time** history, multi-chain integrations,
            and balance/send flows appropriate for business users. **Pixel-perfect** **Figma** UI with strong perf on heavy lists. **🥈 Web3 Hackathon 2023**.\n"
        - "type": "keyResults"
          "items":
            - "val": "+40%"
              "lbl": "UI perf"
            - "val": "🥈"
              "lbl": "Hackathon"
            - "val": "RN"
              "lbl": "iOS + Android"
        - "type": "prose"
          "text": "### Idea & context\n\n**Hawex** is positioned as a financial / payments company: payment processing, accounts, KYC/AML,
            and operational support for finance teams — including **crypto processing** among their offerings (see
            [the LinkedIn company profile](https://ru.linkedin.com/company/hawex?trk=ppro_cprof)). **HAWEX Wallet** is the mobile layer that turns that
            positioning into a concrete journey: **paying international contractors and related crypto-native operations**, with clear history,
            statuses, and secure key handling.\n\nThe engineering challenge was a **production-grade** client: HD/BIP39, signing, multi-chain,
            performance, and **App Store / Play** cadence. External validation: **🥈 Web3 Hackathon 2023**.\n"
        - "type": "prose"
          "text": "### Outcomes\n\n- **Product focus:** the client serves **cross-border settlements and contractor payout** scenarios on crypto rails under the Hawex brand — not a disposable demo wallet.\n- **Performance:** **RTK Query** + render discipline delivered roughly **+40%** UI responsiveness vs the prior state approach on demanding screens.\n- **Design:** **pixel-perfect** Figma execution with adaptive components across **iOS & Android**.\n- **Crypto layer:** **HD wallet**, **BIP39** handling, signing & broadcasting, balances/history across **multiple chains**.\n- **Delivery:** **Fastlane** + **CI/CD** for repeatable builds and automated **App Store / Play Store** releases.\n- **Team:** documented architecture and **code review** for consistent patterns.\n- **Recognition:** **🥈 Web3 Hackathon 2023**.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Engineering notes\n\n**Wallet & settlement flows:** **HD wallet**, **BIP39**, signing & broadcasting across networks;
            balances and **transaction history** matter for transparency of cross-border payouts and counterparty reconciliation.\n\n**Client:**
            **React Native** + **TypeScript**, **Redux** + **RTK Query**, balance-motion animations and list hygiene under load.\n\n**Shipping:**
            **CI/CD** + **Fastlane**. Product: [hawex.com/hawexwallet](https://hawex.com/hawexwallet); company context:
            [Hawex Group LTD on LinkedIn](https://ru.linkedin.com/company/hawex?trk=ppro_cprof).\n"
