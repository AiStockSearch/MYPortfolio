          "text": "### Idea & context\n\n**Transline International** (Kazakhstan) — mobile client for **transport logistics**
            serving **drivers and dispatchers** on **unreliable field connectivity**. Freight, logistics, warehouse, foreign trade.\n\n**Role:**
            **Senior Mobile / Lead Mobile Architect** — architectural and delivery leadership of the mobile track (Code Review, API
            contracts, releases). **Engagement:** GPH / Outstaff · contract from **June 2026**.\n\n**Unique project stack:** RN CLI +
            **New Architecture** (TurboModules / Fabric / JSI); **KMP ↔ TypeScript**; **Tamagui**; **Offline-First**
            (SQLite / WatermelonDB); logistics peripherals (scanners / sensors).\n\n### Where the code lives & what's public\n\n**Main
            product repository** — private team GitLab (`transline-mobile/mobile`), **not published in full**.\n\n**Publicly available:**
            technical slice of **TranslineGeoWorker** module (KMP + RN bridge: geo monitoring / geo points, Notify Manager) — demo/open-source
            showcase of contribution, **not the full commercial client** and **not the employer org**:
            [github.com/AiStockSearch/TranslineApp](https://github.com/AiStockSearch/TranslineApp) (`AiStockSearch` / AiStockTech account —
            **candidate's personal tech account**; README: TranslineGeoWorker, package `@transline/geoworker`).\n\n### Done in ~2 months
            (Jun — Jul 2026)\n\n- **Audit** of current codebase and target architecture (layers, native bridges, offline/sync, Bridge risks).\n-
            Fixed **target monorepo design** (Yarn / pnpm Workspaces) and isomorphic module boundaries; started extracting first shared packages.\n-
            Prepared and launched **staged migration plan** of key native calls to New Architecture (TurboModules / Fabric / JSI); completed
            **first Swift/Kotlin ↔ TS bindings** (not «full app migration»).\n- **Prototype / spike** of KMP business layer integration with RN
            CLI via TurboModules (end-to-end iOS/Android → JS path) with production-rollout criteria; public showcase — GeoWorker module.\n-
            Laid **UI foundation** on Tamagui + StyleSheet / styled-components and component isolation in **React Cosmos** for faster iterations.\n-
            Designed **target Offline-First schema** (SQLite / WatermelonDB + sync queues) and peripheral contracts (scanners / sensors);
            **sync & hardware implementation in progress**.\n- Established **processes**: Code Review, backend API agreements; **CI/CD draft**
            on GitHub Actions + Fastlane (build → signing → TestFlight / Play Internal) — pipeline **initiated, not claimed fully stabilized**
            in 2 months.\n- **Architecture & KMP:** RN CLI logistics client + shared KMP layer (geo / notify and adjacent domains) integrated
            with TypeScript via TurboModules / JSI.\n\n### In progress / roadmap (not claimed complete)\n\n- Full monorepo migration and all
            isomorphic libraries.\n- Full New Architecture migration and Bridge removal.\n- Production-ready KMP layer in all critical domains.\n-
            Stable Offline-First field sync and full peripheral integration.\n- Stable **60 FPS** on all heavy scenarios as measurable release outcome
            (**goal, not final KPI** for Jun–Jul).\n\n### Technical leadership\n\n**Tech Lead:** mobile track leadership, Code Review, API contract
            design and internal tooling release process.\n\n### UI system\n\nBuilt interface system on **Tamagui**, styled-components and custom
            StyleSheet with UI isolation via **React Cosmos** and **Atomic Design**.\n"
