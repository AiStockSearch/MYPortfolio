          "text": "### Идея и контекст\n\n**Транслайн Интернэшнл** (Казахстан) — мобильный клиент транспортной логистики
            для **водителей и диспетчеров** в условиях **нестабильной связи** «в поле». Перевозки, логистика, склад, ВЭД.\n\n**Роль:**
            **Senior Mobile / Lead Mobile Architect** — архитектурное и delivery-лидерство мобильного направления (Code Review,
            API-контракты, релизы). **Формат:** ГПХ / Outstaff · контракт с **июня 2026**.\n\n**Уникальный стек проекта:** RN CLI +
            **New Architecture** (TurboModules / Fabric / JSI); **KMP ↔ TypeScript**; **Tamagui**; **Offline-First**
            (SQLite / WatermelonDB); периферия логистики (сканеры / датчики).\n\n### Где код и что публично\n\n**Основной
            product-репозиторий** — приватный GitLab команды (`transline-mobile/mobile`), **не выкладывается целиком**.\n\n**Публично
            доступен** технический срез модуля **TranslineGeoWorker** (KMP + RN bridge: геомониторинг / geo-точки, Notify Manager) —
            демо/open-source витрина вклада, **не весь коммерческий клиент** и **не org работодателя**:
            [github.com/AiStockSearch/TranslineApp](https://github.com/AiStockSearch/TranslineApp) (аккаунт `AiStockSearch` /
            AiStockTech — **личный tech-аккаунт кандидата**; README: TranslineGeoWorker, пакет `@transline/geoworker`).\n\n###
            За ~2 месяца (июнь — июль 2026) — фактически сделано\n\n- **Аудит** текущей кодовой базы и целевой архитектуры (слои,
            нативные связки, offline/sync, риски Bridge).\n- Зафиксирован **целевой дизайн монорепозитория** (Yarn / pnpm Workspaces)
            и границы изоморфных модулей; начато выделение первых shared-пакетов.\n- Подготовлен и запущен **поэтапный план миграции**
            ключевых native-вызовов на New Architecture (TurboModules / Fabric / JSI); выполнены **первые связки Swift/Kotlin ↔ TS**
            (не «полный перевод приложения»).\n- **Прототип / spike** интеграции KMP-бизнес-слоя с RN CLI через TurboModules
            (сквозной путь iOS/Android → JS), с критериями для production-rollout; публичная витрина — модуль GeoWorker.\n- Заложена
            **UI-база** на Tamagui + StyleSheet / styled-components и изоляция компонентов в **React Cosmos** для ускорения итераций.\n-
            Спроектирована **целевая схема Offline-First** (SQLite / WatermelonDB + очереди синхронизации) и контракты для периферии
            (сканеры / датчики); **реализация синка и железа — в работе**.\n- Выстроены **процессы**: Code Review, договорённости по API
            с бэкендом; **черновик CI/CD** на GitHub Actions + Fastlane (сборка → signing → TestFlight / Play Internal) — пайплайн
            **инициирован, не заявлен как полностью стабилизированный** за 2 месяца.\n- **Архитектура & KMP:** сопровождение RN CLI
            клиента логистики + интеграция общего KMP-слоя (гео / notify и смежные домены) с TypeScript через TurboModules / JSI.\n\n###
            В процессе / roadmap (не заявлено как завершённое)\n\n- Полный перевод монорепо и всех изоморфных библиотек.\n- Полная
            миграция на New Architecture и снятие Bridge.\n- Production-ready KMP-слой во всех критичных доменах.\n- Стабильный Offline-First
            sync «в поле» и полная интеграция периферии.\n- Стабильные **60 FPS** на всех тяжёлых сценариях как измеримый итог релиза
            (**цель, не финальный KPI** за июнь–июль).\n\n### Техническое лидерство\n\n**Tech Lead:** техническое руководство мобильным
            направлением, Code Review, проектирование API-контрактов и процесс релизов внутреннего инструментария.\n\n### UI-система\n\nПостроил
            систему интерфейсов на **Tamagui**, styled-components и кастомных StyleSheet с изоляцией UI через **React Cosmos** и **Atomic
            Design**.\n"
