          "text": "### Архитектура и New Architecture\n\n**React Native CLI** + **New Architecture** (TurboModules / Fabric / JSI).
            Поэтапная миграция native-вызовов; первые связки **Swift/Kotlin ↔ TypeScript**. Целевой монорепо **Yarn / pnpm Workspaces**
            с изоморфными модулями.\n\n### KMP ↔ TypeScript\n\n**Kotlin Multiplatform** бизнес-слой интегрирован с RN через TurboModules /
            JSI. Публичная витрина: **TranslineGeoWorker** (`@transline/geoworker`) — геомониторинг, Notify Manager.\n\n### Offline-First
            (целевая схема)\n\n**SQLite / WatermelonDB** + очереди синхронизации; контракты периферии (сканеры / датчики). Реализация
            синка и железа — **в работе**.\n\n### UI-система\n\n**Tamagui** + styled-components + StyleSheet; **React Cosmos** + **Atomic
            Design** для изолированной отладки UI.\n\n### CI/CD и процессы\n\nЧерновик **GitHub Actions + Fastlane** (сборка → signing →
            TestFlight / Play Internal) — **инициирован**, не полностью стабилизирован. Code Review, API-контракты с бэкендом.\n\n###
            Публичные артефакты и disclaimer\n\n- **Приватный продукт:** GitLab `transline-mobile/mobile` (по запросу / NDA).\n- **Публичное
            демо:** [github.com/AiStockSearch/TranslineApp](https://github.com/AiStockSearch/TranslineApp) — **личный tech-аккаунт
            AiStockSearch, не org «Транслайн»**. Это не полный TranslineApp и не proof всей компании.\n"
