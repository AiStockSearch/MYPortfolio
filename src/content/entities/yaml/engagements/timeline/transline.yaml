          "text": "### О проекте\n\n**Транслайн Интернэшнл** (Казахстан) — компания в сегменте **автомобильных перевозок,
            логистики, склада и ВЭД**. Продукт, над которым работаю: **мобильный клиент транспортной логистики** для двух ключевых
            ролей — **водители** и **диспетчеры** — в условиях **нестабильной связи «в поле»** (слабые сети на маршрутах, офлайн-окна,
            необходимость догонять синк при появлении канала).\n\nКлиент закрывает операционный контур логистики: геомониторинг /
            geo-точки, уведомления, работа с периферией (сканеры / датчики), сценарии диспетчеризации. Это **не витрина и не
            маркетинговое приложение**, а production-инструмент с жёсткими требованиями к надёжности offline/sync и нативным
            связкам.\n\n**Моя роль:** **Senior Mobile Developer (React Native) / Lead Mobile Architect** — архитектурное и
            delivery-лидерство мобильного направления: Code Review, API-контракты с бэкендом, релизный контур. **Формат занятости:**
            ГПХ / Outstaff, контракт с **июня 2026** (на дату резюме ~2 месяца: июнь — июль 2026).\n\n**Уникальный стек проекта:**
            React Native **CLI** + **New Architecture** (TurboModules / Fabric / JSI); интеграция **Kotlin Multiplatform (KMP) ↔
            TypeScript**; UI на **Tamagui** (+ StyleSheet / styled-components); целевой **Offline-First** на SQLite / WatermelonDB;
            периферия логистики.\n\n**Где код.** Основной product-репозиторий — **приватный GitLab** команды (`transline-mobile/mobile`),
            целиком не публикуется. Публично доступен только технический срез **TranslineGeoWorker** (см. блок «Кастомные наработки»
            и GitHub ниже) — это демо/open-source витрина вклада, **не весь коммерческий клиент** и **не org работодателя**. Аккаунт
            `AiStockSearch` — **личный tech-аккаунт** кандидата.\n\n### Что сделано за ~2 месяца (июнь — июль 2026)\n\n- **Аудит**
            кодовой базы и целевой архитектуры: слои, нативные связки, offline/sync, риски Bridge.\n- Зафиксирован **целевой дизайн
            монорепозитория** (Yarn / pnpm Workspaces) и границы изоморфных модулей; начато выделение первых shared-пакетов.\n-
            Запущен **поэтапный план миграции** ключевых native-вызовов на New Architecture; выполнены **первые связки Swift/Kotlin ↔
            TS** (это не «полный перевод приложения»).\n- **Spike** интеграции KMP-бизнес-слоя с RN CLI через TurboModules (сквозной
            путь iOS/Android → JS) с критериями для production-rollout; публичная витрина — модуль GeoWorker.\n- Заложена **UI-база**
            на Tamagui + StyleSheet / styled-components и изоляция в **React Cosmos** (Atomic Design).\n- Спроектирована **целевая
            схема Offline-First** (SQLite / WatermelonDB + очереди синхронизации) и контракты периферии; **реализация синка и железа —
            в работе**.\n- Выстроены **процессы**: Code Review, договорённости по API; **черновик CI/CD** (GitHub Actions + Fastlane →
            TestFlight / Play Internal) — пайплайн **инициирован**, не заявлен как полностью стабилизированный за 2 месяца.\n-
            Сопровождение RN CLI клиента + интеграция общего KMP-слоя (гео / notify и смежные домены) через TurboModules / JSI.\n\n###
            Roadmap (не заявлено как завершённое за 2 месяца)\n\n- Полный перевод монорепо и всех изоморфных библиотек.\n- Полная
            миграция на New Architecture и снятие Bridge.\n- Production-ready KMP-слой во всех критичных доменах.\n- Стабильный
            Offline-First sync «в поле» и полная интеграция периферии.\n- Стабильные **60 FPS** на тяжёлых сценариях как KPI релиза
            (**цель**, не финальный итог июня–июля).\n"
