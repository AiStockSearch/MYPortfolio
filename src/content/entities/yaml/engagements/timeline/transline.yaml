          "text": "### Architecture & New Architecture\n\n**React Native CLI** + **New Architecture** (TurboModules / Fabric / JSI). Staged native-call
            migration; first **Swift/Kotlin ↔ TypeScript** bindings. Target **Yarn / pnpm Workspaces** monorepo with isomorphic modules.\n\n### KMP ↔
            TypeScript\n\n**Kotlin Multiplatform** business layer integrated with RN via TurboModules / JSI. Public showcase: **TranslineGeoWorker**
            (`@transline/geoworker`) — geo monitoring, Notify Manager.\n\n### Offline-First (target design)\n\n**SQLite / WatermelonDB** + sync queues;
            peripheral contracts (scanners / sensors). Sync & hardware implementation — **in progress**.\n\n### UI system\n\n**Tamagui** + styled-components
            + StyleSheet; **React Cosmos** + **Atomic Design** for isolated UI debugging.\n\n### CI/CD & processes\n\nDraft **GitHub Actions + Fastlane**
            (build → signing → TestFlight / Play Internal) — **initiated**, not fully stabilized. Code Review, backend API contracts.\n\n### Public artifacts
            & disclaimer\n\n- **Private product:** GitLab `transline-mobile/mobile` (on request / NDA).\n- **Public demo:** [github.com/AiStockSearch/TranslineApp](https://github.com/AiStockSearch/TranslineApp)
            — **personal AiStockSearch tech account, not Transline employer org**. Not the full TranslineApp and not proof of the entire company.\n"
