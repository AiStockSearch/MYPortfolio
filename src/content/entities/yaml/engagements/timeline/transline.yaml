          "text": "### About the project\n\n**Transline International** (Kazakhstan) operates in **road freight, logistics, warehouse
            and foreign trade**. The product I work on is a **transport-logistics mobile client** for two key roles — **drivers** and
            **dispatchers** — under **unreliable field connectivity** (weak networks on routes, offline windows, catch-up sync when a
            channel returns).\n\nThe client covers the operational logistics contour: geo monitoring / geo points, notifications, peripheral
            work (scanners / sensors), dispatch scenarios. This is **not a marketing showcase app** — it is a production tool with hard
            requirements for offline/sync reliability and native bridges.\n\n**My role:** **Senior Mobile Developer (React Native) / Lead
            Mobile Architect** — architectural and delivery leadership of the mobile track: Code Review, backend API contracts, release
            contour. **Engagement:** GPH / Outstaff, contract from **June 2026** (~2 months on the resume date: Jun — Jul 2026).\n\n**Unique
            project stack:** React Native **CLI** + **New Architecture** (TurboModules / Fabric / JSI); **Kotlin Multiplatform (KMP) ↔
            TypeScript**; UI on **Tamagui** (+ StyleSheet / styled-components); target **Offline-First** on SQLite / WatermelonDB; logistics
            peripherals.\n\n**Where the code lives.** The main product repo is the team's **private GitLab** (`transline-mobile/mobile`) and
            is not published in full. Publicly available is only the **TranslineGeoWorker** technical slice (see «Custom work» / GitHub below)
            — a demo/open-source contribution showcase, **not the full commercial client** and **not the employer org**. The `AiStockSearch`
