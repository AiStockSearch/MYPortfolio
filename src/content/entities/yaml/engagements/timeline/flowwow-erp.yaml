        - "type": "prose"
          "text": "### Idea & business context\n\n[Flowwow](https://flowwow.com/) connects buyers and florist merchants; the partner
            network needed **one operational backbone**: accurate **cut-flower** inventory, receiving, stocktakes, in-store POS, and
            roll-up analytics for **multi-store** operators — not a patchwork of spreadsheets. The ERP vision was a **mobile-first**
            client that survives **offline** work on poor Wi‑Fi and stays dependable on **budget Android** hardware.\n\nI owned the
            **greenfield React Native** effort: shape the app so cashiers and regional directors read **the same facts** through tablet-
            vs phone-dense layouts, and make **Google Play** shipping **repeatable**.\n"
        - "type": "prose"
          "text": "### Outcomes\n\n- **Operations:** closed the loop on **inventory**, **POS**, **orders**, and network-level reporting —
            fewer reconciliation gaps between the shop floor and back office.\n- **Reliability:** **offline-first** + SQLite sync keeps
            stores running during network drops; **NetInfo** + **retry** policies make failures understandable.\n- **Catalog scale:**
            delta sync + data discipline targeted **~40% faster** reference sync for **50k+ SKU** stores; client-side validation targeted
            **~20% fewer** receiving mistakes.\n- **Hardware UX:** dual form factors, toned-down **animations** on POS paths, **native
            modals** instead of fragile bottom sheets — fewer “frozen register” incidents.\n- **Delivery:** **CI/CD** + **Fastlane**,
            **~3–4** Play releases, polished **store listing** + **signing** hygiene, and a partner-facing **landing**.\n- **Engineering
            culture:** **Clean Architecture**, **folder-by-feature**, **Atomic Design**, and **Cosmos/Storybook** made the ERP easier to
            evolve without a monolithic UI trap.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Client architecture\n\n**Code organization:** <span class='m'>Clean Architecture</span> with
            explicit presentation / domain / data boundaries; warehouse / receiving / POS workflows were modeled as
            cohesive use-cases rather than “mega-screens”. The repository followed a <span class='m'>folder-by-feature</span>
            layout to keep cross-feature coupling low in a large ERP codebase.\n\n**UI:** <span class='m'>Atomic Design</span>
            (atoms → organisms) for reusable controls in dense tables and forms. **Navigation:** <span class='m'>React Navigation</span>
            + <span class='m'>react-native-screens</span> for native-ish stacks and lifecycle behaviour — fewer JS overlays in
            POS-critical paths.\n\n**State & networking:** <span class='m'>Redux Toolkit</span> as the store foundation;
            <span class='m'>RTK Query</span> for server cache & generated request flows; <span class='m'>Axios</span> for
            bespoke HTTP clients and edge integrations. Data shaping used <span class='m'>Ramda</span>. I also kept internal
            composition modules <span class='m'>k-store</span> / <span class='m'>k-chain</span> to structure the Redux layer and
            stepwise async pipelines (helpful at **50k+ SKU** scale).\n\n**Modals:** moved to <span class='m'>native RN Modals</span>
            and away from <span class='m'>@gorhom/bottom-sheet</span> due to gesture races and instability on several budget
            Android devices used at the counter.\n\n### Data, hardware & analytics\n\n**Offline-first:** on-device
            <span class='m'>SQLite</span>, sync with idempotency, offline queues & retries; delta compression cut reference sync
            time by roughly **40%** for **50k+ SKU** stores. **Hardware:** Bluetooth scanners (Symbol/Zebra), Epson thermal
            printers. **Integrations:** REST to core services, <span class='m'>Firebase</span> (FCM + analytics) +
            <span class='m'>Amplitude</span> for product funnels & event analytics. **iOS beta:** <span class='m'>TestFlight</span>.
            Client validation reduced receiving/input mistakes (**about −20%** on typical human errors).\n\n### Delivery\n\n**CI/CD**
            for **Android** builds, **Play Console**, **keystore** hygiene, **~3–4 releases**, lightweight **landing**.
            Marketplace: [flowwow.com](https://flowwow.com/).\n"
