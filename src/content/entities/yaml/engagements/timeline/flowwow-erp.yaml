          "alt": "Flowwow ERP"
        - "type": "section"
          "sectionKey": "overview"
        - "type": "prose"
          "text": "[Flowwow](https://flowwow.com/) is an online marketplace for customers and sellers in flowers &
            gifts; partner tooling covers day-to-day retail operations. I worked on a **greenfield React Native ERP**
            used to **inventory and stocktake cut flowers** in partner stores — receiving, recounts, stock control and
            discrepancy handling. I also owned key **sales-side flows**: **POS / cash register integration**,
            **order creation**, and UX where speed and reliability matter more than visual flair.\n\nI implemented
            **tablet and phone layouts** so the same workflows feel natural both at the counter and in the back room.
            For POS-class devices I **disabled or reduced animations** to keep the UI responsive and unambiguous when
            the network flakes. The product also emphasized **analytics across the store network** — directors need
            roll-ups on inventory, staffing and operational bottlenecks. I worked in a disciplined way: strong
            validation, predictable error handling, and careful attention to edge cases on the floor.\n\nOn the
            **shipping** side I built a **CI/CD** setup for React Native **Android** builds, ran **~3–4 production
            releases** to **Google Play**, curated the **store listing** (copy + visuals), and kept a clean
            **signing-key / publishing** workflow with sane versioning. I also delivered a small **landing page** as a
            product / partner-facing showcase.\n"
