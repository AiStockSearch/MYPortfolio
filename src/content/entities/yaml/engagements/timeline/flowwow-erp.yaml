    Redux Toolkit + RTK Query + Axios + Ramda, доменные модули **k-store** / **k-chain**, Firebase и Amplitude,
    TestFlight; нативные модалки вместо @gorhom/bottom-sheet. CI/CD, 3–4 релиза, лендинг, стор и ключи подписи."
