        - "type": "section"
          "sectionKey": "overview"
        - "type": "prose"
          "text": "[Flowwow](https://flowwow.com/) — маркетплейс для клиентов и продавцов в сегменте цветов и
            подарков; внутренняя линейка продуктов покрывает операции партнёрских магазинов. Я участвовал в
            **мобильном ERP с нуля на React Native** для **инвентаризации и учёта срезанных цветов** в торговых
            точках: приход, пересчёты, остатки, контроль расхождений. Параллельно закрывал **бизнес-контуры
            продаж** — подключение **кассы (POS)**, оформление **заказов**, сценарии, где важны скорость и
            отсутствие сюрпризов в UI.\n\nОтдельно прорабатывал **планшетную и телефонную вёрстку**: одни и те же
            сценарии должны быть удобны и на кассе в зале, и в подсобке. Для «железа» уровня кассы сознательно
            **ослаблял или отключал анимации**, чтобы не тратить кадры и не вводить пользователя в заблуждение при
            ошибках сети. В продукте также был упор на **аналитику и отчётность по сети** — директорам и операционным
            ролям нужны сводки по остаткам, персоналу и узким местам. Работал плотно и аккуратно: упор на
            предсказуемые сценарии, валидацию на клиенте и ясную обработку ошибок.\n\nПараллельно закрывал
            **доставку в прод**: собрал **CI/CD** под сборки React Native (Android), провёл **3–4 релиза** в
            **Google Play**, оформил карточку приложения (тексты, графика), выстроил процесс **публикаций с ключами
            подписи** и аккуратным версионированием. Отдельно сделал **лендинг** — витрина продукта и понятное
            описание ценности для партнёров.\n"
        - "type": "keyResults"
          "items":
            - "val": "0→1"
              "lbl": "Greenfield RN"
            - "val": "POS"
              "lbl": "Касса в контуре"
            - "val": "CI/CD"
              "lbl": "Сборка и релизы"
            - "val": "Play"
              "lbl": "Листинг и ключи"
        - "type": "prose"
          "text": "### Идея и бизнес-контекст\n\n[Flowwow](https://flowwow.com/) — маркетплейс цветов и подарков; партнёрская сеть
            магазинов нуждается в **одном операционном контуре**: быстрый учёт **срезанных цветов**, приёмка, инвентаризация,
            продажи на кассе и понятная аналитика для **сети**, а не разрозненные таблицы. **Идея ERP** — вынести склад и торговый зал
            в мобильное приложение, которое работает **в офлайне** на плохом Wi‑Fi и не ломается на бюджетных Android.\n\nМоя роль —
            **greenfield React Native**: спроектировать клиент так, чтобы кассир и директор сети получали **одни и те же данные**,
            но с разной плотностью UI (планшет vs телефон), и чтобы доставка в **Google Play** была **воспроизводимой**.\n"
        - "type": "prose"
          "text": "### Итог и эффект\n\n- **Операции:** закрыты циклы **инвентаризации**, **POS/касса**, **заказы** и отчётность по сети —
            меньше ручных расхождений между торговой точкой и бэк-офисом.\n- **Надёжность:** **offline-first** + SQLite-синк — работа в
            магазине не останавливается из‑за обрыва сети; **NetInfo** и **retry** делают сценарии предсказуемыми.\n- **Масштаб
            каталога:** дельта-синк и дисциплина данных дали ориентир **−40%** времени синхронизации справочников для магазинов с
            **50k+ SKU**; валидация на клиенте — ориентир **−20%** типовых ошибок приёмки.\n- **UX на железе:** планшет и телефон,
            ослабленные **анимации** на кассе, **нативные модалки** вместо спорных bottom-sheet — меньше инцидентов «зависла касса».\n-
            **Доставка:** **CI/CD**, **Fastlane**, **3–4** релиза, оформление **Play**-листинга и **ключей подписи**, **лендинг** для
            партнёров.\n- **Инженерная культура:** **Clean Architecture**, структура **по фичам**, **Atomic Design**, **Cosmos/Storybook** —
            проще онбординг и развитие ERP без «монолитного» UI.\n"
        - "type": "section"
          "sectionKey": "technical"
        - "type": "prose"
          "text": "### Архитектура клиента\n\n**Структура кода:** <span class='m'>Clean Architecture</span> с явными
            границами presentation / domain / data; сценарии «приёмка — инвентаризация — касса» оформлялись как
            прикладные слои с тестируемой бизнес-логикой. Файлы и модули шли <span class='m'>по фичам</span>
            (folder-by-feature / «фича — папка»), чтобы не превратить ERP в «комбайн» из поперечных зависимостей.\n\n**UI:**
            <span class='m'>Atomic Design</span> (атомы → организмы) для повторяемых контролов в таблицах и формах.
            **Навигация:** <span class='m'>React Navigation</span> + <span class='m'>react-native-screens</span> —
            максимально «нативный» стек экранов и жизненный цикл, без лишних JS-оверлеев там, где важна стабильность POS.\n\n**Состояние и данные:**
            <span class='m'>Redux Toolkit</span> как база стора; серверное состояние через <span class='m'>RTK Query</span>;
            часть запросов и кастомных клиентов — на <span class='m'>Axios</span>. Для функциональных преобразований и
            нормализации ответов использовал <span class='m'>Ramda</span>. Отдельно оформлены внутренние модули
            <span class='m'>k-store</span> и <span class='m'>k-chain</span> — композиция Redux-слоя и цепочек сайд-эффектов
            / пошаговых асинхронных операций (так проще сопровождать сложные склады с 50k+ SKU).\n\n**Модалки и жесты:**
            перешёл на <span class='m'>нативные модалки</span> платформы; отказался от <span class='m'>@gorhom/bottom-sheet</span>
            из‑за коллизий жестов и нестабильности на части бюджетных Android в сценариях кассы.\n\n### Данные, железо и аналитика\n\n**Offline-first:**
            локальный <span class='m'>SQLite</span>, протокол синка — идемпотентность, очереди, ретраи при обрывах Wi‑Fi;
            дельта-сжатие ускоряло справочники **приблизительно на 40%** для магазинов с **50k+ SKU**. **Железо:**
            Bluetooth-сканеры (Symbol/Zebra), чековые принтеры Epson. **Интеграции:** REST к доменному ядру,
            <span class='m'>Firebase</span> (FCM + analytics) и отдельно <span class='m'>Amplitude</span> для продуктовых воронок
            и событий в приложении. **iOS-бета:** <span class='m'>TestFlight</span>.\n\n### Доставка\n\n**CI/CD** для Android-сборок,
            **Play Console**, **keystore**, **3–4 релиза**, лендинг. Маркетплейс: [flowwow.com](https://flowwow.com/).\n"
        - "type": "techStack"
