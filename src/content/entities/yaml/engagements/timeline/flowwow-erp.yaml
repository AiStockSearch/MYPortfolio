  "en": "Greenfield React Native ERP for Flowwow florists: flower inventory & stocktaking in stores, POS
    integration, orders, tablet + phone layouts, chain analytics; offline-first on the floor. Architecture:
    Clean Architecture boundaries, Atomic Design, feature folders, React Navigation, Redux Toolkit + RTK Query +
    Axios + Ramda, Firebase & Amplitude, TestFlight; native modals instead of Gorhom sheets. CI/CD, ~3–4 Play
    releases, landing, store listing & signing keys."
  "ru": "React Native ERP с нуля для Flowwow: инвентаризация цветов, касса, заказы, планшет/телефон, аналитика
